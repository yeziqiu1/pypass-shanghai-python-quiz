<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#146c94">
<title>PyPass · 上海 Python 二三级刷题库</title>
<style>
:root{
  --bg:#f4f1ea; --bg2:#ebe6dc; --panel:#fffdf8; --panel2:#f8f5ef; --ink:#17222c;
  --muted:#687383; --faint:#98a1aa; --line:#ddd8cd; --line2:#ece8df;
  --blue:#146c94; --blue-d:#0d4f70; --blue-l:#e8f3f8; --amber:#f2a51a; --amber-l:#fff4d7;
  --green:#16836a; --green-l:#e3f5ef; --red:#ce4c4c; --red-l:#fdeceb; --purple:#6959b8;
  --shadow:0 12px 30px rgba(34,44,55,.08); --shadow2:0 6px 18px rgba(34,44,55,.07);
  --radius:18px; --radius-s:12px; --sidebar:248px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 75% 0%,#fff8e9 0,transparent 32%),linear-gradient(135deg,var(--bg),var(--bg2));color:var(--ink);font:15px/1.65 "Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(20,108,148,.23);outline-offset:2px}
.hidden{display:none!important}
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;background:rgba(255,253,248,.91);border-right:1px solid var(--line);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:18px;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px}
.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--blue),#1d9bbf);display:grid;place-items:center;color:white;font-weight:900;letter-spacing:-1px;box-shadow:0 8px 20px rgba(20,108,148,.25)}
.brand strong{display:block;font-size:17px;line-height:1.15}
.brand span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:5px}
.nav button{width:100%;border:0;background:transparent;padding:11px 12px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:10px;color:var(--muted);transition:.18s}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.active{background:var(--blue);color:#fff;box-shadow:0 7px 18px rgba(20,108,148,.2)}
.nav .ico{width:24px;text-align:center;font-weight:800;font-size:12px}
.sidebar-foot{margin-top:auto;padding:13px;border:1px solid var(--line2);background:linear-gradient(145deg,var(--blue-l),#fff);border-radius:16px}
.sidebar-foot strong{display:block;font-size:13px}
.sidebar-foot p{margin:4px 0 0;color:var(--muted);font-size:12px}
.main{min-width:0;padding:26px clamp(18px,3vw,44px) 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.topbar h1{margin:0;font-size:clamp(24px,3vw,34px);letter-spacing:-.8px;line-height:1.15}
.topbar p{margin:5px 0 0;color:var(--muted)}
.top-actions{display:flex;gap:9px;align-items:center}
.mobile-menu{display:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;font-weight:700;transition:.18s;box-shadow:0 2px 6px rgba(20,30,40,.03)}
.btn:hover{transform:translateY(-1px);border-color:#c9c3b7;box-shadow:var(--shadow2)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#3c2a00}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#efc9c8;background:#fff}
.btn.small{padding:6px 10px;border-radius:9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow2);padding:20px}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-top:0;line-height:1.25}
.card h2{font-size:20px}.card h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.hero{position:relative;overflow:hidden;border:0;background:linear-gradient(135deg,#0e5b7c,#1685a9 62%,#27a8b5);color:#fff;box-shadow:0 20px 45px rgba(15,82,111,.23);padding:28px}
.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;right:-95px;top:-120px;background:rgba(255,255,255,.12)}
.hero-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:24px;position:relative;z-index:1}
.hero h1{font-size:clamp(27px,4vw,45px);line-height:1.12;margin:12px 0 10px;letter-spacing:-1.2px}
.hero p{margin:0;color:rgba(255,255,255,.82);max-width:680px}
.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.19);font-size:12px;font-weight:700}
.countdown{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.21);border-radius:16px;padding:15px;backdrop-filter:blur(10px)}
.countdown-label{font-size:12px;color:rgba(255,255,255,.75);margin-bottom:10px}
.countdown-row{display:flex;gap:8px}
.cd-unit{flex:1;text-align:center;background:rgba(0,0,0,.12);border-radius:11px;padding:10px 5px}
.cd-unit b{display:block;font-size:25px;line-height:1}
.cd-unit span{font-size:10px;color:rgba(255,255,255,.68)}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.hero .btn.amber{background:var(--amber);border-color:var(--amber);color:#3c2a00}
.stat{padding:17px;display:flex;flex-direction:column;gap:5px}
.stat b{font-size:27px;line-height:1.1}.stat span{font-size:12px;color:var(--muted)}
.stat-top{display:flex;align-items:center;justify-content:space-between}
.mini-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:12px;background:var(--blue-l);color:var(--blue)}
.progress{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),#2da4ba)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:28px 0 12px}
.section-head h2{margin:0;font-size:21px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.mode-card{position:relative;overflow:hidden;padding:18px;cursor:pointer;transition:.2s}
.mode-card:hover{transform:translateY(-3px);border-color:#bfd9e5;box-shadow:var(--shadow)}
.mode-card .corner{position:absolute;right:-16px;top:-22px;width:74px;height:74px;border-radius:50%;background:var(--blue-l)}
.mode-card .num{position:relative;z-index:1;font-size:25px;font-weight:900;color:var(--blue)}
.mode-card b{display:block;margin-top:11px}.mode-card p{margin:4px 0 0;color:var(--muted);font-size:13px}
.quick-list{display:grid;gap:10px}
.quick-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line2)}
.quick-row:last-child{border-bottom:0}
.quick-row .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 5px var(--amber-l)}
.quick-row b{font-size:14px}.quick-row small{display:block;color:var(--muted)}
.quick-row .spacer{flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted);border:1px solid var(--line2)}
.badge.blue{background:var(--blue-l);color:var(--blue);border-color:#cfe5ef}.badge.amber{background:var(--amber-l);color:#936100;border-color:#f3ddac}.badge.green{background:var(--green-l);color:var(--green);border-color:#c4e6dc}.badge.red{background:var(--red-l);color:var(--red);border-color:#f1d0cf}
.pill-group{display:flex;flex-wrap:wrap;gap:7px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 11px;font-size:13px}
.pill.active{background:var(--blue);border-color:var(--blue);color:#fff}
.filter-bar{display:grid;grid-template-columns:1.2fr repeat(3,.7fr);gap:10px;align-items:end}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 11px;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#84bdd1;box-shadow:0 0 0 3px rgba(20,108,148,.08)}
.kb-card{padding:0;overflow:hidden}
.kb-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:17px 18px;cursor:pointer}
.kb-no{width:42px;height:42px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:900}
.kb-head h3{margin:0;font-size:16px}.kb-head p{margin:2px 0 0;color:var(--muted);font-size:12px}
.kb-body{padding:0 18px 18px 84px;border-top:1px solid var(--line2)}
.kb-body.collapsed{display:none}
.kb-section{margin-top:16px}.kb-section h4{margin:0 0 8px;font-size:13px;color:var(--blue)}
.kb-section ul{margin:0;padding-left:18px}.kb-section li{margin:5px 0}
.kb-traps{background:var(--amber-l);border:1px solid #f2dfaf;border-radius:12px;padding:11px 13px}
.kb-check{display:flex;flex-wrap:wrap;gap:7px}
.kb-check span{background:var(--green-l);color:#116c57;border-radius:99px;padding:4px 9px;font-size:12px}
.practice-wrap{max-width:1000px;margin:0 auto}
.practice-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:13px}
.practice-head .left{display:flex;align-items:center;gap:11px}
.q-counter{font-weight:900;font-size:17px}.q-timer{font-variant-numeric:tabular-nums;color:var(--muted)}
.question-card{padding:clamp(20px,3vw,30px)}
.qmeta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.qtext{font-size:clamp(17px,2vw,21px);line-height:1.55;font-weight:700;margin:0 0 16px}
pre{white-space:pre-wrap;word-break:break-word;background:#18232c;color:#f7fbfc;border-radius:13px;padding:16px 18px;overflow:auto;font:14px/1.58 Consolas,"Cascadia Code","Courier New",monospace;margin:15px 0}
code{font-family:Consolas,"Cascadia Code","Courier New",monospace}
.options{display:grid;gap:10px;margin-top:16px}
.option{display:grid;grid-template-columns:32px minmax(0,1fr);gap:11px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px;text-align:left;transition:.16s}
.option:hover{border-color:#9ac6d6;background:#fbffff;transform:translateX(2px)}
.option .letter{width:29px;height:29px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-weight:900;color:var(--muted)}
.option.correct{border-color:#84cbb9;background:var(--green-l)}.option.correct .letter{background:#cceade;color:var(--green)}
.option.wrong{border-color:#e5a9a7;background:var(--red-l)}.option.wrong .letter{background:#f6d3d2;color:var(--red)}
.option.dim{opacity:.68}
.option:disabled{cursor:default;transform:none}
.answer-box{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:16px}
.answer-box input{padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff}
.feedback{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--panel2)}
.feedback.good{border-color:#b9dfd3;background:var(--green-l)}.feedback.bad{border-color:#efc8c6;background:var(--red-l)}
.feedback-head{display:flex;align-items:center;gap:9px;font-weight:900;margin-bottom:7px}
.feedback p{margin:7px 0 0}.fb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.practice-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px}
.session-dots{display:flex;gap:4px;flex-wrap:wrap}.session-dots i{width:19px;height:5px;border-radius:99px;background:var(--line)}.session-dots i.ok{background:var(--green)}.session-dots i.no{background:var(--red)}.session-dots i.now{background:var(--blue);height:7px;margin-top:-1px}
.empty{text-align:center;padding:48px 20px}.empty .icon{font-size:36px;opacity:.5}
.list-stack{display:grid;gap:12px}
.question-list-item{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start}
.question-list-item .qline{font-weight:750;line-height:1.5}
.question-list-item .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;resize:vertical;min-height:42px}
.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) 0deg,var(--line2) 0deg);position:relative}
.ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
.ring b{position:relative;font-size:23px}.ring span{position:relative;font-size:11px;color:var(--muted);display:block;text-align:center}
.chapter-stat{display:grid;grid-template-columns:140px minmax(0,1fr) 58px;gap:12px;align-items:center;padding:8px 0}
.chapter-stat .name{font-size:13px;font-weight:700}.chapter-stat .score{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.activity{display:flex;align-items:end;gap:6px;height:116px;padding-top:12px}.activity-day{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px;height:100%}.activity-bar{width:100%;max-width:26px;min-height:3px;background:linear-gradient(180deg,#43a7be,var(--blue));border-radius:6px 6px 2px 2px}.activity-day span{font-size:9px;color:var(--muted);white-space:nowrap}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.table tr:last-child td{border-bottom:0}
.callout{border-left:4px solid var(--amber);background:var(--amber-l);padding:12px 14px;border-radius:0 12px 12px 0}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,25,32,.5);z-index:100;display:grid;place-items:center;padding:18px;backdrop-filter:blur(4px)}
.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:20px;padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.modal-head h2{margin:0;font-size:20px}
.toast{position:fixed;right:22px;bottom:22px;z-index:200;background:#18232c;color:#fff;border-radius:12px;padding:11px 14px;box-shadow:var(--shadow);animation:toastIn .22s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:1050px){.cols-4{grid-template-columns:repeat(2,1fr)}.hero-grid{grid-template-columns:1fr}.countdown{max-width:430px}.filter-bar{grid-template-columns:1fr 1fr}.kb-body{padding-left:84px}}
@media (max-width:780px){
  .shell{display:block}.sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);width:270px;transition:.25s}.sidebar.open{transform:none;box-shadow:24px 0 60px rgba(0,0,0,.18)}
  .main{padding:18px 14px 50px}.mobile-menu{display:inline-flex}.topbar{align-items:flex-start}.top-actions .btn span{display:none}.cols-2,.cols-3,.cols-4{grid-template-columns:1fr}.hero{padding:22px}.countdown-row{gap:5px}.cd-unit b{font-size:21px}.filter-bar{grid-template-columns:1fr}.kb-head{grid-template-columns:44px minmax(0,1fr);gap:10px}.kb-head>.badge{display:none}.kb-body{padding:0 15px 16px}.question-list-item{grid-template-columns:1fr}.chapter-stat{grid-template-columns:105px minmax(0,1fr) 45px}.option{grid-template-columns:29px minmax(0,1fr)}
}
@media print{.sidebar,.top-actions,.btn,.hero-actions{display:none!important}.shell{display:block}.main{padding:0}.card{box-shadow:none;break-inside:avoid}.kb-body.collapsed{display:block!important}}
.knowledge-hero{background:linear-gradient(135deg,#fffdf8,#eef8fb)}
.unit-stack{display:grid;gap:10px}
.unit-card{box-shadow:none;padding:0;overflow:hidden;background:#fff}
.unit-summary{width:100%;border:0;background:transparent;padding:13px 14px;display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left}
.unit-title b{display:block;font-size:14px}.unit-title small{display:block;color:var(--muted);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req-dot{display:grid;place-items:center;border-radius:99px;min-height:28px;font-size:11px;font-weight:900}
.req-dot.知道{background:var(--amber-l);color:#936100}.req-dot.理解{background:var(--blue-l);color:var(--blue)}.req-dot.掌握{background:var(--green-l);color:var(--green)}
.unit-body{padding:0 15px 15px;border-top:1px solid var(--line2)}
.unit-body>ul{margin:12px 0 0;padding-left:19px}.unit-body li{margin:5px 0}
.unit-example,.unit-trap{margin-top:11px;border-radius:11px;padding:10px 12px}.unit-example{background:#18232c;color:#f7fbfc}.unit-example pre{margin:7px 0 0;padding:0;background:transparent}.unit-trap{background:var(--amber-l);border:1px solid #f2dfaf}

.unit-note{margin-top:14px;border:1px solid #e7d9b9;background:#fffaf0;border-radius:13px;padding:12px}

.ai-explain-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--blue-l);border:1px solid #cfe5ef}.ai-explain-row span{font-size:11px;color:var(--muted)}

.resume-session-card{border:1px solid #b9d8e4;background:linear-gradient(135deg,#eef8fb,#fffdf8);margin-bottom:16px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.resume-session-main{display:flex;gap:13px;align-items:flex-start;min-width:0}.resume-icon{width:42px;height:42px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none;font-weight:900}.resume-session-card h2{margin:4px 0 5px;font-size:18px}.resume-session-card p{margin:0;color:var(--muted);max-width:720px}

.daily-plan-card{border:1px solid #e4d7b8;background:linear-gradient(135deg,#fffdf7,#fff7e4)}.daily-plan-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.daily-plan-head h2{margin:5px 0 3px}.daily-plan-head p{margin:0;color:var(--muted);font-size:13px}.daily-plan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.plan-task{border:1px solid var(--line2);background:rgba(255,255,255,.82);border-radius:13px;padding:12px}.plan-task-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.plan-task-top b{font-size:13px}.plan-task-top span{font-size:12px;color:var(--blue);font-weight:800}.plan-task small{display:block;color:var(--muted);font-size:11px;margin-top:7px}
@media(max-width:980px){.daily-plan-grid{grid-template-columns:1fr}.daily-plan-head{align-items:flex-start}}

const QUESTIONS = [{"id":"B01","chapter":"basic","difficulty":1,"level":"23","type":"choice","question":"执行 print(type(10 / 2)) 的结果是？","code":null,"options":["<class 'int'>","<class 'float'>","<class 'str'>","<class 'bool'>"],"answer":"B","explanation":"Python 3 中 / 执行真除法，10 / 2 的结果是 5.0，因此类型为 float；// 才是整除。","topic":"数值类型","tags":[]},{"id":"B02","chapter":"basic","difficulty":1,"level":"23","type":"choice","question":"下列哪个变量名合法？","code":null,"options":["2score","class","student_name","my-name"],"answer":"C","explanation":"变量名不能以数字开头，不能使用关键字，也不能包含减号；student_name 合法。","topic":"标识符","tags":[]},{"id":"B03","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"表达式 bool('False') 的结果是？","code":null,"options":["False","True","None","报错"],"answer":"B","explanation":"非空字符串在布尔判断中为 True。字符串 \"False\" 仍然非空，所以 bool(\"False\") 为 True。","topic":"布尔值","tags":[]},{"id":"B04","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"下列语句执行后的输出是？","code":"print(10 // 3)","options":["10","10.0","11","3"],"answer":"D","explanation":"// 是整除且向下取整，10 // 3 得到 3。","topic":"运算符","tags":[]},{"id":"B05","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"下列关于 None 的说法正确的是？","code":null,"options":["None 与 0 相等","None 与空字符串相等","None 表示没有值","None 可以参与所有数值运算"],"answer":"C","explanation":"None 是特殊空值对象，不表示 0 或空字符串。None == 0 为 False，也不能直接参与普通数值运算。","topic":"None","tags":[]},{"id":"B06","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"执行 a, b = 3, 5; a, b = b, a 后，a、b 的值分别是？","code":null,"options":["3、5","5、3","5、5","3、3"],"answer":"B","explanation":"右边的 b, a 会先构成元组 (5, 3)，再依次赋给左边的 a, b，实现交换。","topic":"赋值","tags":[]},{"id":"B07","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"表达式 1 + 2 * 3 ** 2 的值是？","code":null,"options":["49","37","19","25"],"answer":"C","explanation":"优先级从高到低依次为 **、*、+，所以 3 ** 2 = 9，2 * 9 = 18，1 + 18 = 19。","topic":"优先级","tags":[]},{"id":"B08","chapter":"basic","difficulty":3,"level":"3","type":"choice","question":"执行 print(0.1 + 0.2 == 0.3) 的结果最可能是？","code":null,"options":["True","False","None","语法错误"],"answer":"B","explanation":"浮点数采用二进制近似存储，0.1 + 0.2 可能得到 0.30000000000000004。浮点比较应使用 math.isclose()。","topic":"浮点误差","tags":[]},{"id":"B09","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"用户输入 12 时，num = input() 得到的 num 是？","code":null,"options":["整数 12","浮点数 12.0","字符串 \"12\"","布尔值 True"],"answer":"C","explanation":"input() 始终返回字符串，需要 int() 或 float() 转换后才能做数值运算。","topic":"输入输出","tags":[]},{"id":"B10","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"f\"{score:.1f}\" 的作用是？","code":null,"options":["保留一位小数","保留一位整数","把 score 转成布尔值","删除 score 的小数部分"],"answer":"A","explanation":"f-string 中 :.1f 表示按定点小数格式保留 1 位小数，并做四舍五入显示。","topic":"格式化","tags":[]},{"id":"B11","chapter":"basic","difficulty":2,"level":"3","type":"choice","question":"执行 print(5 == 5.0) 的结果是？","code":null,"options":["True","False","TypeError","None"],"answer":"A","explanation":"Python 中数值比较关注数值是否相等，5 与 5.0 数值相等，因此结果为 True。","topic":"比较运算","tags":[]},{"id":"B12","chapter":"basic","difficulty":3,"level":"3","type":"choice","question":"执行 print(isinstance(True, int)) 的结果是？","code":null,"options":["True","False","None","报错"],"answer":"A","explanation":"bool 是 int 的子类，True 的整数值为 1，因此 isinstance(True, int) 为 True。","topic":"类型判断","tags":[]},{"id":"F01","chapter":"flow","difficulty":1,"level":"23","type":"choice","question":"range(1, 6) 生成的整数个数是？","code":null,"options":["4","5","6","7"],"answer":"B","explanation":"range(start, stop) 包含起点，不包含终点，因此为 1、2、3、4、5，共 5 个。","topic":"range","tags":[]},{"id":"F02","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"下列循环输出了几行？","code":"for i in range(3):\n    print(i)","options":["3","4","5","死循环"],"answer":"A","explanation":"range(3) 得到 0、1、2，所以循环体执行 3 次。","topic":"for 循环","tags":[]},{"id":"F03","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"while 循环中，continue 的作用是？","code":null,"options":["结束整个循环","跳过本轮剩余语句，进入下一次判断","终止程序","重新启动循环变量"],"answer":"B","explanation":"continue 只结束本轮迭代；break 才会立即结束整个循环。","topic":"continue","tags":[]},{"id":"F04","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"执行下面代码后，输出是？","code":"for i in range(5):\n    if i == 2:\n        break\n    print(i, end=\"\")\nprint(2)","options":["01","012","2","012345"],"answer":"B","explanation":"i 为 0 和 1 时分别打印 0、1；i 为 2 时 break 结束循环。循环外的 print(2) 继续执行，并与前面的输出连在一起，结果是 012。","topic":"break","tags":[]},{"id":"F05","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"if 语句中，下列哪个值会被当作假值？","code":null,"options":["[0]","{}","\"0\"","1"],"answer":"B","explanation":"空容器为假，因此 {} 为假；[0] 和 \"0\" 非空，均为真。","topic":"真值判断","tags":[]},{"id":"F06","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"x = 10\nif x > 0:\n    print(\"B\")\nelse:\n    print(\"C\")","options":["A","B","C","无输出"],"answer":"B","explanation":"x > 0 为真，执行第一个分支，因此输出 B。","topic":"if","tags":[]},{"id":"F07","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"if-elif-else 中，最多会执行几个分支？","code":null,"options":["1 个","2 个","3 个","所有分支"],"answer":"A","explanation":"条件分支按顺序判断，一旦某个条件为真，执行对应分支后便跳过整个 if-elif-else 结构。","topic":"分支","tags":[]},{"id":"F08","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"执行下面代码后，i 的最终值是？","code":"i = 0\nwhile i < 3:\n    i += 1\n    print(i)","options":["0","2","3","4"],"answer":"C","explanation":"i 从 0 依次执行循环体并自增，直到 i < 3 不成立，最终 i 为 3。","topic":"while","tags":[]},{"id":"F09","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"运行下面代码，输出是？","code":"try:\n    x = 1 / 0\nexcept ZeroDivisionError:\n    print(2)","options":["1","2","3","除零错误"],"answer":"B","explanation":"try 中 1 / 0 抛出 ZeroDivisionError，被 except 捕获后执行 except 分支。","topic":"异常处理","tags":[]},{"id":"F10","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"若用户可能输入非数字，最适合使用哪种结构避免程序崩溃？","code":null,"options":["for","while True","try-except","continue"],"answer":"C","explanation":"int(input()) 对非法输入会抛出 ValueError，用 try-except 捕获并提示用户重新输入最稳妥。","topic":"异常处理","tags":[]},{"id":"F11","chapter":"flow","difficulty":3,"level":"3","type":"choice","question":"以下代码输出是？","code":"for i in range(3):\n    pass\nelse:\n    print(i)","options":["0","1","2","3"],"answer":"C","explanation":"for 的 else 在没有因 break 终止时执行。循环正常完成后 i 的最后一个值是 2，再执行 else 输出 2。","topic":"循环 else","tags":[]},{"id":"F12","chapter":"flow","difficulty":3,"level":"3","type":"choice","question":"下面算式 1 <= x < 5 等价于？","code":null,"options":["1 <= x and x < 5","1 <= x or x < 5","1 < x and x <= 5","总是 True"],"answer":"A","explanation":"Python 支持链式比较，1 <= x < 5 等价于 1 <= x and x < 5。","topic":"链式比较","tags":[]},{"id":"S01","chapter":"string","difficulty":1,"level":"23","type":"choice","question":"执行 \"ab\" * 3 的结果是？","code":null,"options":["ab3","ababab","aaabbb","报错"],"answer":"B","explanation":"字符串与整数相乘会重复字符串，结果依次为 ab、abab、ababab。","topic":"字符串运算符","tags":[]},{"id":"S02","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"s = \"Python\"; print(s[-2]) 的结果是？","code":null,"options":["o","h","n","t"],"answer":"A","explanation":"负索引从右往左计数，-1 是 n，-2 是 o。","topic":"索引","tags":[]},{"id":"S03","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"s = \"0123456789\"; s[2:6] 的结果是？","code":null,"options":["2345","23456","234","3456"],"answer":"A","explanation":"切片包含起点、不包含终点，索引 2 到 5 对应字符 2、3、4、5。","topic":"切片","tags":[]},{"id":"S04","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"执行 \"  Python  \".strip() 的结果是？","code":null,"options":["\"  Python\"","\"Python  \"","\"Python\"","\"\""],"answer":"C","explanation":"strip() 删除字符串首尾的空白字符，中间的 Python 保留。","topic":"strip","tags":[]},{"id":"S05","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"执行 \"a,b,c\".split(\",\") 的结果是？","code":null,"options":["\"abc\"","['a', 'b', 'c']","('a', 'b', 'c')","['a,b,c']"],"answer":"B","explanation":"split(\",\") 按逗号切分，返回字符串列表。","topic":"split","tags":[]},{"id":"S06","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"print(len(\"Shang\"))","options":["4","5","6","7"],"answer":"B","explanation":"len() 返回字符串字符个数，共有 5 个字符。","topic":"len","tags":[]},{"id":"S07","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"下面哪一项可以判断字符串 s 是否只由数字组成？","code":null,"options":["s.isdigit()","s.islower()","s.startswith(\"0\")","s.find(\"0\")"],"answer":"A","explanation":"isdigit() 在字符串非空且所有字符都是数字字符时返回 True。","topic":"字符串方法","tags":[]},{"id":"S08","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"执行 \"abc\".upper() 的结果是？","code":null,"options":["ABC","abc","Abc","报错"],"answer":"A","explanation":"upper() 返回全部大写的新字符串，原字符串不会被修改。","topic":"大小写","tags":[]},{"id":"S09","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"print(\"{}:{:03d}\".format(\"HELLO\", 3))","options":["HELLO-3","HELLO:3","HELLO:003","报错"],"answer":"C","explanation":"第一个 {} 放入 HELLO；中间的冒号是原样输出的普通字符；:03d 表示把整数 3 补零到总宽度 3 位，得到 003，所以整体是 HELLO:003。","topic":"format","tags":[]},{"id":"S10","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"f-string 中若要显示变量 score 的两位小数，正确写法是？","code":null,"options":["f\"{score}\"","f\"{score:2}\"","f\"{score:.2f}\"","f\"{score:.2d}\""],"answer":"C","explanation":".2f 表示保留两位小数；d 用于整数格式。","topic":"f-string","tags":[]},{"id":"S11","chapter":"string","difficulty":3,"level":"3","type":"choice","question":"执行 \"banana\".find(\"na\", 3) 的结果是？","code":null,"options":["2","4","6","-1"],"answer":"B","explanation":"从索引 3 开始搜索，第一个 na 位于索引 4。find() 不存在时返回 -1。","topic":"find","tags":[]},{"id":"S12","chapter":"string","difficulty":3,"level":"3","type":"choice","question":"下面代码输出是？","code":"print(str(True))","options":["true","True","1","False"],"answer":"B","explanation":"str(True) 得到 \"True\"，不是 \"true\"；字符串比较区分大小写。","topic":"类型转换","tags":[]},{"id":"L01","chapter":"list_tuple","difficulty":1,"level":"23","type":"choice","question":"执行 [1, 2] + [3, 4] 的结果是？","code":null,"options":["[1, 2, 3, 4]","[1, 2, [3, 4]]","[4, 6]","报错"],"answer":"A","explanation":"列表相加表示拼接，返回新列表；列表与数字相加会报错。","topic":"列表拼接","tags":[]},{"id":"L02","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"执行 nums = [1, 2, 3]; nums.append(4) 后，nums 是？","code":null,"options":["[1, 2, 3]","[4, 1, 2, 3]","[1, 2, 3, 4]","[1, 2, 4, 3]"],"answer":"C","explanation":"append(x) 在列表末尾追加一个元素，原地修改列表。","topic":"append","tags":[]},{"id":"L03","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"执行 nums = [1, 2, 3]; nums.insert(1, 9) 后，nums 是？","code":null,"options":["[1, 9, 2, 3]","[9, 1, 2, 3]","[1, 2, 9, 3]","[1, 2, 3, 9]"],"answer":"A","explanation":"insert(index, value) 将 value 插入到指定索引之前。","topic":"insert","tags":[]},{"id":"L04","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"nums = [1, 2, 3]\nprint(nums.pop())","options":["1","2","3","5"],"answer":"B","explanation":"pop() 删除并返回最后一个元素，原列表变为 [1, 3]。","topic":"pop","tags":[]},{"id":"L05","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"下面哪一项能生成 [1, 4, 9, 16]？","code":null,"options":["[x * 2 for x in range(1, 5)]","[x ** 2 for x in range(1, 5)]","[x ** 2 for x in range(4)]","[x * x for x in range(5)]"],"answer":"B","explanation":"range(1, 5) 生成 1 到 4，列表解析式将每个数平方。","topic":"列表解析式","tags":[]},{"id":"L06","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"对于元组 t = (1, 2, 3)，下面哪项会引发错误？","code":null,"options":["t[0]","t[1:]","t[0] = 9","len(t)"],"answer":"C","explanation":"元组一旦创建不能修改元素，索引赋值会抛出 TypeError。","topic":"元组不可变","tags":[]},{"id":"L07","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"执行 a, b, *rest = [1, 2, 3, 4] 后，rest 是？","code":null,"options":["[3, 4]","(3, 4)","[2, 3, 4]","4"],"answer":"A","explanation":"星号解包把剩余元素收集为列表 [3, 4]。","topic":"解包","tags":[]},{"id":"L08","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"for i, ch in enumerate(\"abc\"):\n    if ch == \"b\":\n        print(i)","options":["0","1","2","3"],"answer":"B","explanation":"enumerate() 默认从 0 开始，当元素为 b 时索引为 1。","topic":"enumerate","tags":[]},{"id":"L09","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"执行 sorted([3, 1, 2], reverse=True) 的结果是？","code":null,"options":["[1, 2, 3]","[3, 2, 1]","[3, 1, 2]","None"],"answer":"B","explanation":"sorted() 返回新列表，reverse=True 表示降序排列。","topic":"排序","tags":[]},{"id":"L10","chapter":"list_tuple","difficulty":3,"level":"3","type":"choice","question":"关于 nums = [[0] * 2] * 3 的说法正确的是？","code":null,"options":["三行是彼此独立的列表","三行引用同一个内层列表","该表达式会报错","结果是三个整数"],"answer":"B","explanation":"* 复制的是对象引用，三个位置引用同一个内层列表，修改任意一行会影响所有行。应使用列表解析式创建。","topic":"浅复制","tags":[]},{"id":"L11","chapter":"list_tuple","difficulty":3,"level":"3","type":"choice","question":"执行下面代码后，a 是？","code":"import copy\na = [1, 2]\nb = copy.copy(a)\nb.append(3)","options":["[1, 2]","[1, 2, 3]","[3]","报错"],"answer":"A","explanation":"copy.copy(a) 创建浅复制，追加到 b 不会影响 a。","topic":"浅复制","tags":[]},{"id":"L12","chapter":"list_tuple","difficulty":3,"level":"3","type":"choice","question":"表达式 list(zip([1, 2], \"ab\")) 的结果是？","code":null,"options":["[(1, 'a'), (2, 'b')]","[(1, 2), ('a', 'b')]","[1, 'a', 2, 'b']","报错"],"answer":"A","explanation":"zip() 将多个可迭代对象按位置配对，返回由元组组成的迭代器。","topic":"zip","tags":[]},{"id":"D01","chapter":"dict_set","difficulty":1,"level":"23","type":"choice","question":"创建一个空字典的正确写法是？","code":null,"options":["{}","[]","()","set()"],"answer":"A","explanation":"{} 是空字典；set() 是空集合；[] 是空列表；() 是空元组。","topic":"字典创建","tags":[]},{"id":"D02","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"d = {\"a\": 1}; print(d.get(\"b\", 0)) 的结果是？","code":null,"options":["0","None","KeyError","\"b\""],"answer":"A","explanation":"get(key, default) 在键不存在时返回默认值，不会抛 KeyError。","topic":"get","tags":[]},{"id":"D03","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"执行 d = {\"a\": 1}; d[\"b\"] = 2 后，d 是？","code":null,"options":["{\"a\": 1}","{\"b\": 2}","{\"a\": 1, \"b\": 2}","报错"],"answer":"C","explanation":"给不存在的键赋值会新增键值对；给已有键赋值会更新值。","topic":"更新字典","tags":[]},{"id":"D04","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"遍历 d = {\"a\": 1, \"b\": 2} 时，for key in d 得到的是？","code":null,"options":["所有键","所有值","键值对","索引"],"answer":"A","explanation":"直接遍历字典默认遍历键；需要值可用 d.values()，需要键值对可用 d.items()。","topic":"字典迭代","tags":[]},{"id":"D05","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"执行 d = dict([(\"a\", 1), (\"b\", 2)]) 后，d 是？","code":null,"options":["{\"a\": 1, \"b\": 2}","{(\"a\", 1), (\"b\", 2)}","[(\"a\", 1), (\"b\", 2)]","报错"],"answer":"A","explanation":"dict() 可以把由二元组构成的可迭代对象转换成字典。","topic":"字典构造","tags":[]},{"id":"D06","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"统计单词出现次数时，最适合使用的数据结构是？","code":null,"options":["列表","集合","字典","元组"],"answer":"C","explanation":"字典可以建立“单词 -> 次数”的映射，遇到单词时用 counts[word] += 1 累加。","topic":"分类计数","tags":[]},{"id":"D07","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"执行 s = set([1, 2, 2, 3]) 后，len(s) 是？","code":null,"options":["2","3","4","报错"],"answer":"B","explanation":"集合会自动去重，最终包含 1、2、3 共 3 个元素。","topic":"集合去重","tags":[]},{"id":"D08","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"集合运算 {1, 2} & {2, 3} 的结果是？","code":null,"options":["{1, 3}","{1, 2, 3}","{2}","set()"],"answer":"C","explanation":"& 表示交集，只保留同时属于两个集合的元素。","topic":"集合运算","tags":[]},{"id":"D09","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"d = {\"a\": 1, \"b\": 2}\nfor k, v in d.items():\n    if k == \"b\":\n        print(v)","options":["1","2","3","报错"],"answer":"B","explanation":"items() 返回键值对，遍历时用两个变量分别接收键和值；b 对应的值是 2。","topic":"items","tags":[]},{"id":"D10","chapter":"dict_set","difficulty":3,"level":"3","type":"choice","question":"为什么列表不能作为字典的键？","code":null,"options":["列表不能迭代","列表是可变对象，可能无法保持稳定哈希值","列表不能比较大小","列表只能存放数字"],"answer":"B","explanation":"字典键必须是可哈希对象。列表可变，内容改变会破坏哈希定位，因此不能作为键；元组在元素都可哈希时可以。","topic":"可哈希","tags":[]},{"id":"D11","chapter":"dict_set","difficulty":3,"level":"3","type":"choice","question":"执行 d = {\"a\": 1}; e = d.copy(); d[\"a\"] = 9 后，e[\"a\"] 是？","code":null,"options":["9","1","None","报错"],"answer":"B","explanation":"copy() 创建新的字典和键值映射，修改原字典的已有值不会影响副本。","topic":"字典复制","tags":[]},{"id":"D12","chapter":"dict_set","difficulty":3,"level":"3","type":"choice","question":"执行下面代码输出是？","code":"d = {x: x + 1 for x in range(1, 3)}\nprint(d)","options":["{1: 2, 2: 3}","{1: 1, 2: 2}","{2: 1, 3: 2}","报错"],"answer":"A","explanation":"字典推导式对每个 x 建立 x 到 x+1 的映射。","topic":"字典推导式","tags":[]},{"id":"U01","chapter":"function","difficulty":1,"level":"23","type":"choice","question":"定义函数使用的关键字是？","code":null,"options":["function","def","lambda","class"],"answer":"B","explanation":"Python 使用 def 定义具名函数；lambda 用于定义匿名函数表达式。","topic":"函数定义","tags":[]},{"id":"U02","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"下面函数返回什么？","code":"def add(a, b):\n    print(a + b)\n\nx = add(1, 2)","options":["3","None","TypeError","0"],"answer":"B","explanation":"函数没有显式 return 时，默认返回 None。","topic":"return","tags":[]},{"id":"U03","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"调用 f(3, 4) 时，3 传给哪个参数？","code":"def f(a, b):\n    return a + b","options":["b","a","两个参数都收到 3","不确定"],"answer":"B","explanation":"位置参数按从左到右的顺序传给形参，因此 a 得到 3，b 得到 4。","topic":"位置参数","tags":[]},{"id":"U04","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"def greet(name=\"同学\") 中，name 属于？","code":null,"options":["位置参数","默认参数","关键字参数","可变参数"],"answer":"B","explanation":"形参等号后提供默认值，调用时可以不传该参数。","topic":"默认参数","tags":[]},{"id":"U05","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"*args 收集到函数内部后是什么类型？","code":null,"options":["列表","元组","字典","集合"],"answer":"B","explanation":"*args 把多余的位置参数收集成元组；**kwargs 收集成字典。","topic":"可变参数","tags":[]},{"id":"U06","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"def f(**kwargs) 中，**kwargs 适合接收什么？","code":null,"options":["任意位置参数","任意关键字参数","只有数字参数","返回值"],"answer":"B","explanation":"**kwargs 把未匹配的关键字参数收集为字典。","topic":"关键字参数","tags":[]},{"id":"U07","chapter":"function","difficulty":3,"level":"3","type":"choice","question":"下面代码输出是？","code":"x = 1\ndef f():\n    x = 2\nf()\nprint(x)","options":["1","2","3","报错"],"answer":"B","explanation":"函数内对 x 赋值会创建局部变量；若需要修改外部整数，需要使用 nonlocal 或 global。","topic":"作用域","tags":[]},{"id":"U08","chapter":"function","difficulty":3,"level":"3","type":"choice","question":"若函数内部要修改外层函数的局部变量，应使用？","code":null,"options":["global","nonlocal","local","static"],"answer":"B","explanation":"nonlocal 声明变量来自最近的外层函数作用域；global 针对模块全局变量。","topic":"nonlocal","tags":[]},{"id":"U09","chapter":"function","difficulty":2,"level":"3","type":"choice","question":"lambda x: x + 1 等价于哪种函数？","code":null,"options":["接收 x 并返回 x+1","打印 x+1","只接收无参","返回函数对象名"],"answer":"A","explanation":"lambda 表达式创建一个匿名函数，冒号右边是表达式，结果作为返回值。","topic":"lambda","tags":[]},{"id":"U10","chapter":"function","difficulty":2,"level":"3","type":"choice","question":"调用 f(a=1, b=2) 使用的是什么传参方式？","code":null,"options":["位置参数","关键字参数","可变参数","默认参数"],"answer":"B","explanation":"调用时形如 参数名=值 的写法是关键字参数，不依赖参数位置。","topic":"关键字参数","tags":[]},{"id":"U11","chapter":"function","difficulty":3,"level":"3","type":"choice","question":"下面代码输出是？","code":"def add(x):\n    x.append(2)\n\na = [0]\nadd(a)\nprint(a)","options":["[0, 1]","[0, 2]","[0]","报错"],"answer":"B","explanation":"x 与传入列表引用同一个对象，append(2) 会原地改变列表。","topic":"可变对象传参","tags":[]},{"id":"U12","chapter":"function","difficulty":3,"level":"3","type":"choice","question":"哪个选项正确给函数添加类型提示？","code":null,"options":["def f(x: int) -> str:","def f(int x): str:","def f(x): -> str","function f(x: int)"],"answer":"A","explanation":"参数类型提示写在参数名后，返回类型提示写在 -> 后，类型提示不会强制运行时类型。","topic":"类型提示","tags":[]},{"id":"A01","chapter":"advanced","difficulty":2,"level":"3","type":"choice","question":"list(map(lambda x: x * 2, [1, 2, 3])) 的结果是？","code":null,"options":["[1, 2, 3]","[2, 4, 6]","[1, 4, 9]","[2, 6]"],"answer":"B","explanation":"map() 对每个元素应用函数并返回迭代器，list() 将其转换为列表。","topic":"map","tags":[]},{"id":"A02","chapter":"advanced","difficulty":2,"level":"3","type":"choice","question":"list(filter(lambda x: x % 2 == 0, [1, 2, 3, 4])) 的结果是？","code":null,"options":["[1, 3]","[2, 4]","[1, 2, 3, 4]","[]"],"answer":"B","explanation":"filter() 保留使函数返回真值的元素，即偶数 2、4。","topic":"filter","tags":[]},{"id":"A03","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"sorted([\"bbb\", \"a\", \"cc\"], key=len) 的结果是？","code":null,"options":["[\"a\", \"cc\", \"bbb\"]","[\"bbb\", \"cc\", \"a\"]","[\"a\", \"bbb\", \"cc\"]","报错"],"answer":"A","explanation":"key=len 按字符串长度排序，长度依次为 1、2、3。","topic":"sorted key","tags":[]},{"id":"A04","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"reduce(lambda a, b: a + b, [1, 2, 3, 4]) 的结果是？","code":null,"options":["10","24","9","报错"],"answer":"A","explanation":"reduce 从左到右两两累积：((1+2)+3)+4 = 10。需从 functools 导入 reduce。","topic":"reduce","tags":[]},{"id":"A05","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"生成器函数最明显的特征是使用哪个关键字？","code":null,"options":["return","yield","lambda","async"],"answer":"B","explanation":"生成器函数执行到 yield 时产生值并可暂停，下一次迭代从暂停处继续。","topic":"生成器","tags":[]},{"id":"A06","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"执行 list(g) 时，下面生成器会输出什么？","code":"def g():\n    yield 1\n    x = 2\n    yield x","options":["[1, 2]","[1, 3]","[2, 3]","[]"],"answer":"A","explanation":"第一次 next 执行到 yield 1；第二次迭代从暂停处继续执行 x=2，再 yield 2。","topic":"yield","tags":[]},{"id":"A07","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"递归函数必须包含的关键要素是？","code":null,"options":["循环","终止条件","全局变量","异常处理"],"answer":"B","explanation":"递归必须有能够停止递归的基线条件，否则会不断调用自身并触发 RecursionError。","topic":"递归","tags":[]},{"id":"A08","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"fact(4) 的返回值是？","code":"def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)","options":["10","24","12","4"],"answer":"B","explanation":"递归计算 4! = 4 × 3 × 2 × 1 = 24。","topic":"递归执行","tags":[]},{"id":"A09","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"装饰器本质上接收和返回的是什么？","code":null,"options":["数字","函数对象","字典","字符串"],"answer":"B","explanation":"装饰器是一个接收函数并返回新函数的可调用对象，常用来增加日志、计时等通用功能。","topic":"装饰器","tags":[]},{"id":"A10","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"下面表达式的值是？","code":"[x + 1 for x in range(5) if x % 2 == 0]","options":["[1, 2, 3]","[1, 2, 3, 4]","[0, 1, 2, 3]","报错"],"answer":"A","explanation":"列表解析式中 if 先筛选 0 到 4 中的偶数，再对结果加 1。","topic":"列表解析式","tags":[]},{"id":"T01","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"读取文本文件最常用的内置函数是？","code":null,"options":["read()","open()","input()","load()"],"answer":"B","explanation":"open() 打开文件并返回文件对象，之后可调用 read()、readline() 或 readlines()。","topic":"文件打开","tags":[]},{"id":"T02","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"打开文件写入并清空原内容，应使用的模式是？","code":null,"options":["r","w","a","rb"],"answer":"B","explanation":"w 表示只写模式；文件存在时清空原内容，不存在时创建。a 为追加。","topic":"文件模式","tags":[]},{"id":"T03","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"下面哪个写法能在代码块结束后自动关闭文件？","code":null,"options":["open(...).read()","with open(...) as f:","file = open(...)","read(open(...))"],"answer":"B","explanation":"with 是上下文管理器，离开代码块时会自动关闭文件，即使中途发生异常。","topic":"with","tags":[]},{"id":"T04","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"读取带有中文的 UTF-8 文本文件，正确做法是？","code":null,"options":["open(path)","open(path, \"rb\")","open(path, encoding=\"utf-8\")","open(path, encoding=\"gbk\")"],"answer":"C","explanation":"文本文件应以正确编码打开，UTF-8 中文文件需显式写 encoding=\"utf-8\" 以避免平台默认编码差异。","topic":"编码","tags":[]},{"id":"T05","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"f.readlines() 返回的类型是？","code":null,"options":["字符串","字符串列表","字符列表","生成器"],"answer":"B","explanation":"readlines() 读取所有行并返回列表，每行通常保留末尾换行符。","topic":"readlines","tags":[]},{"id":"T06","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"写入文件后常调用 flush() 或关闭文件，原因是？","code":null,"options":["提高屏幕亮度","把缓冲区数据真正写到文件","改变文件编码","删除原文件"],"answer":"B","explanation":"文件对象通常带缓冲。flush() 强制把缓冲区内容写入底层文件，close() 也会执行刷新。","topic":"缓冲区","tags":[]},{"id":"T07","chapter":"file","difficulty":3,"level":"3","type":"choice","question":"统计文本中非空行数，下面哪个判断最稳妥？","code":null,"options":["if line.strip():","if line == \"\":","if len(line) == 0:","if line is None:"],"answer":"A","explanation":"逐行文本可能包含换行符。line.strip() 去掉首尾空白后若仍有内容，说明该行不是空行。","topic":"文本统计","tags":[]},{"id":"T08","chapter":"file","difficulty":3,"level":"3","type":"choice","question":"处理大文件时，下面哪种方式内存占用通常最低？","code":null,"options":["f.read()","f.readlines()","for line in f:","一次性转为 list(f)"],"answer":"C","explanation":"直接迭代文件对象会逐行读取，适合大文件；read() 和 readlines() 会一次读入较多内容。","topic":"逐行遍历","tags":[]},{"id":"T09","chapter":"file","difficulty":3,"level":"3","type":"choice","question":"CSV 文件首行是标题行，读取后应先做什么？","code":null,"options":["删除首行并忽略列名","保存列名，让后续每行按标题映射字段","转换成整数","逐字符读取"],"answer":"B","explanation":"CSV 数据通常以首行作为列名。csv.DictReader 可把每行转换为“列名: 值”的字典。","topic":"CSV","tags":[]},{"id":"T10","chapter":"file","difficulty":3,"level":"3","type":"choice","question":"下面语句中，line 每次得到的内容是？","code":"with open(\"data.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(line.strip())","options":["文件所有内容","文件中的下一行","单个字符","单词列表"],"answer":"B","explanation":"for line in f 逐行迭代文件对象，因此每次得到一行字符串。","topic":"文件迭代","tags":[]},{"id":"R01","chapter":"regex","difficulty":2,"level":"3","type":"choice","question":"在正则表达式中，匹配一个或多个数字的正确写法是？","code":null,"options":["\\d+","\\d*","[a-z]+",".+"],"answer":"A","explanation":"\\d 表示数字字符，+ 表示前面的元素出现一次或多次。Python 字符串中通常写成原始字符串 r\"\\d+\"。","topic":"字符类","tags":[]},{"id":"R02","chapter":"regex","difficulty":2,"level":"3","type":"choice","question":"re.search(r\"cat\", \"a cat\") 返回什么？","code":null,"options":["字符串 cat","匹配对象","整数 3","None"],"answer":"B","explanation":"search() 找到匹配时返回 Match 对象，可通过 .group() 获取匹配文本。","topic":"search","tags":[]},{"id":"R03","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"执行 re.findall(r\"\\d+\", \"A12B345\") 的结果是？","code":null,"options":["[\"12\", \"345\"]","[12, 345]","[\"A12B345\"]","[\"1\", \"2\", \"3\", \"4\", \"5\"]"],"answer":"A","explanation":"findall() 返回所有非重叠匹配组成的列表，匹配数字串为 \"12\" 和 \"345\"。","topic":"findall","tags":[]},{"id":"R04","chapter":"regex","difficulty":2,"level":"3","type":"choice","question":"正则表达式 ^abc 的含义是？","code":null,"options":["匹配行尾的 abc","匹配行首的 abc","匹配任意 abc","匹配空格后的 abc"],"answer":"B","explanation":"^ 锚定字符串或行开头；$ 锚定结尾。","topic":"锚点","tags":[]},{"id":"R05","chapter":"regex","difficulty":2,"level":"3","type":"choice","question":"元字符 . 在正则表达式中默认匹配什么？","code":null,"options":["任意一个字符（换行符除外）","任意多个字符","只有数字","只有字母"],"answer":"A","explanation":"点号默认匹配任意单个字符，但通常不匹配换行符；*、+、? 才是数量限定符。","topic":"元字符","tags":[]},{"id":"R06","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"re.sub(r\"\\s+\", \" \", text) 的作用是？","code":null,"options":["删除所有空白","把连续空白替换成一个空格","把空格替换成换行","统计空白数量"],"answer":"B","explanation":"\\s+ 匹配一个或多个空白字符，sub() 将其统一替换成一个空格。","topic":"sub","tags":[]},{"id":"R07","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"要提取形如 2026-09-20 的日期中的年份，捕获组可以写成？","code":null,"options":["(\\d{4})-\\d{2}-\\d{2}","\\d{4}-\\d{2}-\\d{2}","[2026]-09-20","\\w{4}-\\w{2}-\\w{2}"],"answer":"A","explanation":"圆括号形成捕获组，\\d{4} 精确匹配 4 个数字；可通过 group(1) 取得年份。","topic":"捕获组","tags":[]},{"id":"R08","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"正则表达式 r\"ab*c\" 可以匹配下列哪一项？","code":null,"options":["ac","abbc","ab","bc"],"answer":"B","explanation":"b* 表示 b 出现 0 次或多次，所以 ac 和 abbc 都能匹配；选项中 abbc 是匹配项。","topic":"量词","tags":[]},{"id":"R09","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"re.match() 与 re.search() 的关键区别是？","code":null,"options":["match 只从字符串开头匹配","search 只匹配一次","match 只能匹配数字","二者完全相同"],"answer":"A","explanation":"re.match() 从字符串起始位置尝试匹配；re.search() 扫描整个字符串寻找第一个匹配。","topic":"match/search","tags":[]},{"id":"R10","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"为什么正则字符串前常加 r？","code":null,"options":["表示只读字符串","将反斜杠视为普通字符，减少转义混乱","让字符串变成列表","启用正则后自动去重"],"answer":"B","explanation":"r\"\\d+\" 是原始字符串，反斜杠不会被 Python 字符串转义优先处理，表达正则更清楚。","topic":"原始字符串","tags":[]},{"id":"M01","chapter":"modules_oop","difficulty":2,"level":"23","type":"choice","question":"导入 math 模块后，使用平方根函数的正确写法是？","code":null,"options":["math.sqrt(9)","sqrt(9)","math->sqrt(9)","import sqrt"],"answer":"A","explanation":"import math 后需用 math.sqrt() 访问；若使用 from math import sqrt，则可直接调用 sqrt()。","topic":"import","tags":[]},{"id":"M02","chapter":"modules_oop","difficulty":2,"level":"3","type":"choice","question":"import numpy as np 中 as 的作用是？","code":null,"options":["定义类","给模块起别名","抛出异常","转换为字符串"],"answer":"B","explanation":"as 为导入的模块或对象设置本地别名，之后可用 np 代替 numpy。","topic":"别名","tags":[]},{"id":"M03","chapter":"modules_oop","difficulty":2,"level":"3","type":"choice","question":"随机生成 1 到 6 的整数，应使用？","code":null,"options":["random.random()","random.randint(1, 6)","random.choice()","random.shuffle(6)"],"answer":"B","explanation":"randint(a, b) 返回包含两端的整数。random() 返回 [0.0, 1.0) 浮点数。","topic":"random","tags":[]},{"id":"M04","chapter":"modules_oop","difficulty":1,"level":"23","type":"choice","question":"定义类使用的关键字是？","code":null,"options":["object","class","struct","def"],"answer":"B","explanation":"Python 使用 class 定义类，使用 def 定义函数或方法。","topic":"类定义","tags":[]},{"id":"M05","chapter":"modules_oop","difficulty":2,"level":"3","type":"choice","question":"实例方法的第一个参数通常命名为 self，它表示什么？","code":null,"options":["类名","当前实例对象","全局字典","返回值"],"answer":"B","explanation":"self 是实例方法调用时自动传入的当前对象引用，通过它访问实例属性。","topic":"self","tags":[]},{"id":"M06","chapter":"modules_oop","difficulty":2,"level":"3","type":"choice","question":"创建类实例时自动调用的初始化方法是？","code":null,"options":["__new__","__init__","__str__","__call__"],"answer":"B","explanation":"__init__ 是初始化方法，对象创建后自动调用，常用来自定义实例属性。","topic":"__init__","tags":[]},{"id":"M07","chapter":"modules_oop","difficulty":2,"level":"3","type":"choice","question":"子类继承父类属性的主要作用是？","code":null,"options":["删除父类","复用并扩展父类功能","让所有属性变为私有","避免创建对象"],"answer":"B","explanation":"继承可以复用父类属性与方法，并通过重写、多态进行扩展。","topic":"继承","tags":[]},{"id":"M08","chapter":"modules_oop","difficulty":2,"level":"3","type":"choice","question":"方法名前后双下划线（如 __name）通常表示？","code":null,"options":["完全不存在","特殊方法或名称改写约定","必须全局变量","只能用于字符串"],"answer":"B","explanation":"双下划线名称常是 Python 特殊协议；类属性中的 __name 形式还会触发名称改写。以单下划线开头通常表示内部使用。","topic":"访问控制","tags":[]},{"id":"M09","chapter":"modules_oop","difficulty":3,"level":"3","type":"choice","question":"执行 p = Person(\"小明\") 后，p.name 通常从哪里获得？","code":"class Person:\n    def __init__(self, name):\n        self.name = name","options":["函数参数","实例属性","模块名","文件句柄"],"answer":"B","explanation":"__init__ 中 self.name = name 会为当前实例保存 name 属性。","topic":"实例属性","tags":[]},{"id":"M10","chapter":"modules_oop","difficulty":3,"level":"3","type":"choice","question":"下列关于包和模块的说法正确的是？","code":null,"options":["模块只能包含函数","包是组织多个模块的目录","包不能有子目录","import 会删除原文件"],"answer":"B","explanation":"模块通常是 .py 文件，包是带有结构的目录，可组织多个模块和子包。","topic":"包与模块","tags":[]},{"id":"M11","chapter":"modules_oop","difficulty":3,"level":"3","type":"choice","question":"with open(path) as f 中，with 主要为文件对象做什么？","code":null,"options":["创建新进程","确保离开代码块时自动清理资源","把文件转换为字典","只读打开"],"answer":"B","explanation":"with 使用上下文管理协议，在代码块结束后自动调用清理逻辑，文件会自动关闭。","topic":"上下文管理","tags":[]},{"id":"M12","chapter":"modules_oop","difficulty":3,"level":"3","type":"choice","question":"关于 jieba、wordcloud、openpyxl 等第三方库，正确说法是？","code":null,"options":["Python 自带无需安装","通常需要用 pip 安装后再导入","只能在数据库中使用","不能处理中文"],"answer":"B","explanation":"第三方库通常使用 pip install 包名 安装，再通过 import 使用；标准库如 random、math 无需单独安装。","topic":"第三方库","tags":[]},{"id":"X01","chapter":"db_api","difficulty":2,"level":"3","type":"choice","question":"Python 标准库中操作 SQLite 数据库的模块是？","code":null,"options":["sqlite3","sqlite","sql","dbapi"],"answer":"A","explanation":"Python 标准库使用 sqlite3 模块连接和操作 SQLite 数据库。","topic":"sqlite3","tags":[]},{"id":"X02","chapter":"db_api","difficulty":2,"level":"3","type":"choice","question":"连接数据库通常使用哪个函数？","code":null,"options":["sqlite3.connect(path)","sqlite3.open(path)","sqlite3.read(path)","sqlite3.create(path)"],"answer":"A","explanation":"sqlite3.connect() 连接数据库，文件不存在时可创建；之后使用游标执行 SQL。","topic":"连接数据库","tags":[]},{"id":"X03","chapter":"db_api","difficulty":2,"level":"3","type":"choice","question":"创建游标通常使用的语句是？","code":null,"options":["cur = conn.cursor()","cur = conn.execute()","cur = sqlite3.cursor()","cur = conn.fetchall()"],"answer":"A","explanation":"游标用于执行 SQL 并获取结果，通常先 conn.cursor() 创建。","topic":"游标","tags":[]},{"id":"X04","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"执行 SELECT 后读取一行，应使用？","code":null,"options":["fetchone()","fetchall()","execute()","close()"],"answer":"A","explanation":"fetchone() 返回下一行；fetchall() 返回剩余全部行；execute() 用于执行 SQL。","topic":"fetchone","tags":[]},{"id":"X05","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"关闭数据库连接应使用？","code":null,"options":["conn.close()","conn.stop()","conn.exit()","close(conn)"],"answer":"A","explanation":"使用 conn.close() 关闭连接，释放数据库资源。","topic":"close","tags":[]},{"id":"X06","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"从 JSON 字符串转换为 Python 对象，应使用？","code":null,"options":["json.loads()","json.dumps()","json.read()","json.object()"],"answer":"A","explanation":"loads() 把 JSON 字符串解析为 Python 对象；dumps() 把 Python 对象编码为 JSON 字符串。","topic":"JSON 解析","tags":[]},{"id":"X07","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"把 Python 字典转换成 JSON 字符串，应使用？","code":null,"options":["json.dumps(data)","json.loads(data)","str.encode(data)","dict(data)"],"answer":"A","explanation":"json.dumps(data) 返回 JSON 格式字符串；ensure_ascii=False 可保留中文。","topic":"JSON 编码","tags":[]},{"id":"X08","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"RESTful API 中最常见的资源交互数据格式是？","code":null,"options":["JSON","EXE","DLL","TXT"],"answer":"A","explanation":"RESTful API 常用 HTTP 方法配合 JSON 传输结构化数据。","topic":"RESTful","tags":[]},{"id":"X09","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"requests.get(url) 返回的对象通常需要调用什么读取 JSON？","code":null,"options":["resp.json()","resp.readjson()","resp.parse()","json(resp)"],"answer":"A","explanation":"requests 库的响应对象提供 json() 方法，将响应内容解析为 Python 对象。","topic":"requests","tags":[]},{"id":"X10","chapter":"db_api","difficulty":3,"level":"3","type":"choice","question":"执行 SQL 时使用参数化查询的主要好处是？","code":null,"options":["提高安全性，减少 SQL 注入风险","让 SQL 自动变成 Python","关闭数据库","不需要游标"],"answer":"A","explanation":"不要把用户输入直接拼进 SQL。应使用占位符和参数传入，例如 cur.execute(\"SELECT * FROM t WHERE id = ?\", (id,))。","topic":"参数化查询","tags":[]},{"id":"G01","chapter":"gui_viz","difficulty":2,"level":"3","type":"choice","question":"Python 标准库中常用于简单桌面 GUI 的模块是？","code":null,"options":["tkinter","sqlite3","re","csv"],"answer":"A","explanation":"tkinter 是 Python 标准库中的 GUI 工具包，适合制作入门级窗口程序。","topic":"tkinter","tags":[]},{"id":"G02","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"创建 tkinter 主窗口通常需要？","code":null,"options":["root = tk.Tk()","root = tk.Window()","root = tk.mainloop()","root = tk.Button()"],"answer":"A","explanation":"tk.Tk() 创建根窗口，主循环由 root.mainloop() 启动。","topic":"主窗口","tags":[]},{"id":"G03","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"在 tkinter 中，pack()、grid()、place() 主要用于？","code":null,"options":["控件布局","读取文件","执行 SQL","处理异常"],"answer":"A","explanation":"它们是三种布局管理器：pack 顺序排布，grid 网格定位，place 精确坐标定位。","topic":"布局管理","tags":[]},{"id":"G04","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"按钮点击后调用函数，应使用哪种方法绑定事件？","code":null,"options":["command=","value=","text=","font="],"answer":"A","explanation":"tk.Button(root, text=\"确定\", command=do_something) 会在按钮点击时调用函数。","topic":"事件绑定","tags":[]},{"id":"G05","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"tkinter 的 Entry 控件一般用于？","code":null,"options":["单行文本输入","绘制圆","连接数据库","显示菜单"],"answer":"A","explanation":"Entry 是单行输入框；Text 是多行文本区域；Label 用于显示文本。","topic":"控件","tags":[]},{"id":"G06","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"turtle 绘图中，让画笔向前移动 100 像素应使用？","code":null,"options":["turtle.forward(100)","turtle.move(100)","turtle.draw(100)","turtle.x(100)"],"answer":"A","explanation":"forward(distance) 让海龟沿当前方向前进，也可写作 fd(100)。","topic":"turtle","tags":[]},{"id":"G07","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"matplotlib 中绘制折线图常用的函数是？","code":null,"options":["plt.plot(x, y)","plt.bar(x, y)","plt.pie(x)","plt.scatter(x)"],"answer":"A","explanation":"plot() 绘制折线或曲线；bar() 柱状图；scatter() 散点图；pie() 饼图。","topic":"matplotlib","tags":[]},{"id":"G08","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"在 matplotlib 中给图表添加标题应使用？","code":null,"options":["plt.title(\"标题\")","plt.name(\"标题\")","plt.caption(\"标题\")","plt.texttitle(\"标题\")"],"answer":"A","explanation":"plt.title() 设置当前坐标区标题；plt.xlabel() 和 plt.ylabel() 设置坐标轴标签。","topic":"图表标题","tags":[]},{"id":"G09","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"matplotlib 绘图后通常调用哪个函数显示窗口？","code":null,"options":["plt.show()","plt.draw()","plt.open()","plt.run()"],"answer":"A","explanation":"plt.show() 显示当前图形；保存图片常用 plt.savefig()。","topic":"显示图表","tags":[]},{"id":"G10","chapter":"gui_viz","difficulty":3,"level":"3","type":"choice","question":"在 tkinter Canvas 上绘制一条线应使用？","code":null,"options":["create_line()","draw_line()","add_line()","line()"],"answer":"A","explanation":"Canvas 提供 create_line()、create_oval()、create_rectangle() 等绘图方法。","topic":"Canvas","tags":[]},{"id":"Q01","chapter":"flow","difficulty":2,"level":"23","type":"fill","question":"补全循环，使循环在 n 小于等于 0 时结束。","code":"n = 5\nwhile ______:\n    print(n)\n    n -= 1","answer":["while n > 0:"],"explanation":"条件应写在 while 后：n > 0。循环体会在 n 不大于 0 时停止。","topic":"while","tags":[]},{"id":"Q02","chapter":"string","difficulty":2,"level":"23","type":"fill","question":"补全代码，把字符串中的逗号替换成中文顿号。","code":"text = \"苹果,香蕉,梨\"\nresult = text______\nprint(result)","answer":[".replace(\",\", \"、\")"],"explanation":"字符串的 replace(old, new) 会返回替换后的新字符串。","topic":"replace","tags":[]},{"id":"Q03","chapter":"list_tuple","difficulty":2,"level":"23","type":"fill","question":"补全列表解析式，生成 1 到 10 中偶数的平方。","code":"nums = [x ** 2 ______]\nprint(nums)","answer":["for x in range(2, 11, 2)"],"explanation":"从 2 开始，步长为 2，可以遍历 2、4、6、8、10。","topic":"列表解析式","tags":[]},{"id":"Q04","chapter":"dict_set","difficulty":2,"level":"23","type":"fill","question":"补全代码，安全地把单词 word 的计数加一。","code":"counts = {}\ncounts[word] = ______","answer":["counts.get(word, 0) + 1","counts.get(word,0)+1"],"explanation":"get(word, 0) 在 key 不存在时返回 0，再加 1 后更新计数。","topic":"字典计数","tags":[]},{"id":"Q05","chapter":"function","difficulty":2,"level":"23","type":"fill","question":"补全函数，返回两个数的平均值。","code":"def average(a, b):\n    ______","answer":["return (a + b) / 2","return (a+b)/2"],"explanation":"平均值等于两数之和除以 2，使用 / 得到浮点结果。","topic":"函数返回值","tags":[]},{"id":"Q06","chapter":"file","difficulty":2,"level":"3","type":"fill","question":"补全文件打开语句，以 UTF-8 编码逐行读取文本。","code":"with open(\"data.txt\", ______) as f:\n    for line in f:\n        print(line.strip())","answer":["encoding=\"utf-8\"","encoding='utf-8'"],"explanation":"打开中文文本文件时应显式指定 encoding=\"utf-8\"，避免平台默认编码不一致。","topic":"文件编码","tags":[]},{"id":"Q07","chapter":"regex","difficulty":3,"level":"3","type":"fill","question":"补全正则表达式，匹配一个或多个连续数字。","code":"import re\nm = re.search(r\"______\", \"订单号 A20260920\")","answer":["\\d+","\\\\d+"],"explanation":"\\d 匹配数字，+ 表示一次或多次。Python 中建议写成原始字符串 r\"\\d+\"。","topic":"正则量词","tags":[]},{"id":"Q08","chapter":"db_api","difficulty":3,"level":"3","type":"fill","question":"补全语句，防止把用户输入直接拼进 SQL。","code":"cur.execute(\"SELECT * FROM student WHERE id = ______\", (sid,))","answer":["?","(?)"],"explanation":"sqlite3 使用 ? 作为参数占位符，参数通过 execute 的第二个参数传入，可降低 SQL 注入风险。","topic":"参数化查询","tags":[]},{"id":"Z01","chapter":"flow","difficulty":2,"level":"23","type":"self","question":"从键盘输入若干整数，以空行结束，统计所有偶数的和。","code":null,"modelAnswer":"total = 0\nwhile True:\n    line = input(\"请输入整数（直接回车结束）：\").strip()\n    if line == \"\":\n        break\n    try:\n        number = int(line)\n    except ValueError:\n        print(\"请输入整数\")\n        continue\n    if number % 2 == 0:\n        total += number\nprint(\"偶数之和为：\", total)","explanation":"使用 while True 连续读取，用 strip 去掉首尾空格，空行时 break；再用 try-except 防止非整数输入导致程序崩溃，number % 2 == 0 判断偶数并累加。","topic":"综合控制结构","tags":[]},{"id":"Z02","chapter":"string","difficulty":3,"level":"3","type":"self","question":"给定字符串 text，统计其中数字、英文字母、空格和其他字符的数量。","code":"text = input(\"请输入字符串：\")","modelAnswer":"digits = letters = spaces = others = 0\nfor ch in text:\n    if ch.isdigit():\n        digits += 1\n    elif ch.isalpha():\n        letters += 1\n    elif ch.isspace():\n        spaces += 1\n    else:\n        others += 1\nprint(digits, letters, spaces, others)","explanation":"字符串方法 isdigit、isalpha、isspace 可以分别完成字符分类；注意先判断数字，再判断字母，最后处理其他字符。","topic":"字符串方法","tags":[]},{"id":"Z03","chapter":"list_tuple","difficulty":3,"level":"3","type":"self","question":"读取一行逗号分隔的整数，转换为列表并输出最大值、最小值和平均值。","code":null,"modelAnswer":"text = input(\"请输入整数，用逗号分隔：\")\nnums = [int(x) for x in text.split(\",\")]\nprint(max(nums), min(nums), sum(nums) / len(nums))","explanation":"split(\",\") 切分字符串，列表解析式将每项转成整数；max、min、sum 是内置函数。空列表需另做异常处理。","topic":"列表与统计","tags":[]},{"id":"Z04","chapter":"function","difficulty":3,"level":"3","type":"self","question":"编写函数，接收一个整数列表，返回一个只包含正数的新列表。","code":null,"modelAnswer":"def positive(nums):\n    return [x for x in nums if x > 0]\n\nresult = positive([-2, 0, 3, 5, -1])\nprint(result)","explanation":"使用列表解析式和条件 x > 0 完成筛选，不修改原列表，返回新列表。","topic":"函数与列表解析式","tags":[]},{"id":"Z05","chapter":"advanced","difficulty":3,"level":"3","type":"self","question":"使用递归函数计算斐波那契数列第 n 项，规定 fibonacci(0)=0，fibonacci(1)=1。","code":null,"modelAnswer":"def fibonacci(n):\n    if n <= 1:\n        return n\n    return fibonacci(n - 1) + fibonacci(n - 2)","explanation":"基线条件是 n 为 0 或 1，递归关系是 f(n)=f(n-1)+f(n-2)。该方法直观但重复计算较多，大 n 建议改用迭代。","topic":"递归","tags":[]},{"id":"Z06","chapter":"file","difficulty":3,"level":"3","type":"self","question":"读取 UTF-8 文本文件 data.txt，统计每行去除首尾空白后的字符总数。","code":null,"modelAnswer":"total = 0\nwith open(\"data.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        total += len(line.strip())\nprint(total)","explanation":"with 自动关闭文件，逐行遍历可控制内存；strip() 去掉行末换行和首尾空格，len() 统计字符数。","topic":"文件逐行处理","tags":[]},{"id":"Z07","chapter":"db_api","difficulty":3,"level":"3","type":"self","question":"使用 sqlite3 查询 student 表中年龄大于 18 的学生姓名。","code":null,"modelAnswer":"import sqlite3\n\nconn = sqlite3.connect(\"school.db\")\ncur = conn.cursor()\ncur.execute(\"SELECT name FROM student WHERE age > ?\", (18,))\nrows = cur.fetchall()\nfor row in rows:\n    print(row[0])\nconn.close()","explanation":"先连接数据库并创建游标，使用参数化 SQL 查询，再通过 fetchall() 读取全部结果，最后关闭连接。","topic":"SQLite 查询","tags":[]},{"id":"Z08","chapter":"gui_viz","difficulty":3,"level":"3","type":"self","question":"使用 tkinter 创建窗口：点击按钮后，把标签文字改为“你好，Python”。","code":null,"modelAnswer":"import tkinter as tk\n\nroot = tk.Tk()\nlabel = tk.Label(root, text=\"等待点击\")\nlabel.pack()\n\ndef change_text():\n    label.config(text=\"你好，Python\")\n\nbutton = tk.Button(root, text=\"点击\", command=change_text)\nbutton.pack()\nroot.mainloop()","explanation":"按钮使用 command 绑定回调函数；label.config() 可以修改已有控件属性；最后调用 mainloop() 进入事件循环。","topic":"tkinter 事件","tags":[]},{"id":"N01","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"执行 print(type(3 / 1)) 的结果是？","code":null,"options":["<class 'int'>","<class 'float'>","<class 'str'>","报错"],"answer":"B","explanation":"/ 是真除法，即使能整除，结果也是浮点数 3.0。","topic":"真除法","tags":[]},{"id":"N02","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"表达式 7 % 3 的值是？","code":null,"options":["1","2","2.0","0"],"answer":"A","explanation":"7 除以 3 的余数是 1。","topic":"取余","tags":[]},{"id":"N03","chapter":"basic","difficulty":2,"level":"23","type":"choice","question":"执行 a = 5; a *= 2 后，a 是？","code":null,"options":["5","7","10","25"],"answer":"C","explanation":"a *= 2 等价于 a = a * 2，因此结果为 10。","topic":"复合赋值","tags":[]},{"id":"N04","chapter":"basic","difficulty":3,"level":"3","type":"choice","question":"表达式 2 ** 3 ** 2 的值是？","code":null,"options":["64","512","36","18"],"answer":"B","explanation":"幂运算从右向左结合，先算 3 ** 2 = 9，再算 2 ** 9 = 512。","topic":"结合性","tags":[]},{"id":"N05","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"range(2, 10, 2) 包含的数字是？","code":null,"options":["2,4,6,8","2,4,6,8,10","2,3,4,5","0,2,4,6,8"],"answer":"A","explanation":"从 2 开始，每次增加 2，不包含终点 10。","topic":"range步长","tags":[]},{"id":"N06","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"下面代码输出是？","code":"total = 0\nfor x in range(1, 4):\n    total += x\nprint(total)","options":["3","6","10","15"],"answer":"B","explanation":"循环得到 1、2、3，累加结果为 6。","topic":"累加","tags":[]},{"id":"N07","chapter":"flow","difficulty":2,"level":"23","type":"choice","question":"while 条件一开始就是 False，会执行几次循环体？","code":null,"options":["0 次","1 次","2 次","无限次"],"answer":"A","explanation":"while 先判断条件，条件一开始为假时循环体一次也不执行。","topic":"while","tags":[]},{"id":"N08","chapter":"flow","difficulty":3,"level":"3","type":"choice","question":"下面代码输出是？","code":"for x in range(1, 4):\n    if x % 2:\n        continue\n    print(x)","options":["1","2","3","4"],"answer":"B","explanation":"x=1 和 x=3 时 x % 2 为真，continue 跳过本轮输出；x=2 时条件为假，执行 print(x)，所以只输出 2。","topic":"continue","tags":[]},{"id":"N09","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"执行 \"Python\"[1:4] 的结果是？","code":null,"options":["Pyt","yth","ytho","tho"],"answer":"B","explanation":"索引 1、2、3 分别是 y、t、h，所以结果是 yth。","topic":"切片","tags":[]},{"id":"N10","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"执行 \"a-b-c\".replace(\"-\", \"+\") 的结果是？","code":null,"options":["a-b-c","a+b+c","abc","a+b-c"],"answer":"B","explanation":"replace 会返回把所有 - 替换为 + 后的新字符串。","topic":"replace","tags":[]},{"id":"N11","chapter":"string","difficulty":2,"level":"23","type":"choice","question":"下面哪个表达式结果是 True？","code":null,"options":["\"abc\".isdigit()","\"123\".isdigit()","\"a1\".isalpha()","\" \".isalnum()"],"answer":"B","explanation":"\"123\" 全部由数字字符组成，isdigit() 返回 True。","topic":"字符串判断","tags":[]},{"id":"N12","chapter":"string","difficulty":3,"level":"3","type":"choice","question":"执行 print(\"-\".join([\"2026\",\"09\",\"22\"])) 的结果是？","code":null,"options":["2026-09-22","20260922","[\"2026\",\"09\",\"22\"]","报错"],"answer":"A","explanation":"join 会把列表中的字符串按指定分隔符连接起来。","topic":"join","tags":[]},{"id":"N13","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"执行 nums = [1,2,3]; nums[1] = 9 后，nums 是？","code":null,"options":["[1,9,3]","[9,2,3]","[1,2,9]","报错"],"answer":"A","explanation":"列表可变，索引 1 的元素被修改为 9。","topic":"列表修改","tags":[]},{"id":"N14","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"执行 [1,2,3].count(2) 的结果是？","code":null,"options":["0","1","2","3"],"answer":"B","explanation":"count 统计指定元素出现次数，2 出现 1 次。","topic":"count","tags":[]},{"id":"N15","chapter":"list_tuple","difficulty":2,"level":"23","type":"choice","question":"下面哪个表达式生成了新列表？","code":null,"options":["nums.sort()","nums.append(4)","sorted(nums)","nums.reverse()"],"answer":"C","explanation":"sorted 返回排序后的新列表；sort、append、reverse 都原地修改。","topic":"sorted","tags":[]},{"id":"N16","chapter":"list_tuple","difficulty":3,"level":"3","type":"choice","question":"执行 a,b = (1,2) 后，a、b 分别是？","code":null,"options":["1、2","2、1","(1,2)、None","报错"],"answer":"A","explanation":"元组可以按位置解包，a 得到 1，b 得到 2。","topic":"元组解包","tags":[]},{"id":"N17","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"执行 {\"a\":1}.get(\"b\",9) 的结果是？","code":null,"options":["1","9","None","KeyError"],"answer":"B","explanation":"键 b 不存在，get 返回给定默认值 9。","topic":"get默认值","tags":[]},{"id":"N18","chapter":"dict_set","difficulty":2,"level":"23","type":"choice","question":"执行 {1,2}|{2,3} 的结果是？","code":null,"options":["{1,2,3}","{2}","{1,3}","{1,2,2,3}"],"answer":"A","explanation":"| 表示集合并集，集合自动去重。","topic":"集合并集","tags":[]},{"id":"N19","chapter":"dict_set","difficulty":3,"level":"3","type":"choice","question":"下面代码输出是？","code":"d = {\"a\": 1, \"b\": 2}\nfor x in d:\n    print(x)\n    break","options":["a","b","1","2"],"answer":"A","explanation":"直接遍历字典默认得到键，因此输出 a。","topic":"字典遍历","tags":[]},{"id":"N20","chapter":"dict_set","difficulty":3,"level":"3","type":"choice","question":"删除字典中 key 对应的键值对并返回值，应使用？","code":null,"options":["d.pop(key)","d.remove(key)","del d[key]","d.clear()"],"answer":"A","explanation":"pop(key) 删除并返回对应值；clear 会清空整个字典。","topic":"字典删除","tags":[]},{"id":"N21","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"函数没有显式 return 时返回什么？","code":null,"options":["0","空字符串","None","自动返回最后一行"],"answer":"C","explanation":"Python 函数没有 return 时默认返回 None。","topic":"返回值","tags":[]},{"id":"N22","chapter":"function","difficulty":2,"level":"23","type":"choice","question":"def f(x=10) 中，调用 f() 时 x 的值是？","code":null,"options":["0","10","None","报错"],"answer":"B","explanation":"没有传参时使用默认值 10。","topic":"默认参数","tags":[]},{"id":"N23","chapter":"function","difficulty":2,"level":"3","type":"choice","question":"调用 f(1,2,3) 时，*args 收集到的是什么？","code":null,"options":["列表 [1,2,3]","元组 (1,2,3)","字典 {1:2,3:None}","单个整数"],"answer":"B","explanation":"*args 把多余的位置参数收集为元组。","topic":"可变参数","tags":[]},{"id":"N24","chapter":"function","difficulty":3,"level":"3","type":"choice","question":"下面代码输出是？","code":"def add(x):\n    return x + 5\n\nprint(add(5))","options":["10","20","None","报错"],"answer":"A","explanation":"函数返回 x+5，结果是 10。","topic":"函数返回","tags":[]},{"id":"N25","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"list(map(str,[1,2])) 的结果是？","code":null,"options":["[1,2]","[\"1\",\"2\"]","\"12\"","报错"],"answer":"B","explanation":"map 对每个元素应用 str，转换为字符串列表。","topic":"map","tags":[]},{"id":"N26","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"list(filter(lambda x:x>2,[1,2,3,4])) 的结果是？","code":null,"options":["[1,2]","[3,4]","[2,3,4]","[]"],"answer":"B","explanation":"filter 保留满足 x>2 的元素。","topic":"filter","tags":[]},{"id":"N27","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"递归函数必须有哪个部分？","code":null,"options":["循环语句","基线条件","全局变量","列表"],"answer":"B","explanation":"递归必须存在能够停止递归的基线条件。","topic":"递归","tags":[]},{"id":"N28","chapter":"advanced","difficulty":3,"level":"3","type":"choice","question":"下面函数的返回值是？","code":null,"options":["3","6","2","1"],"answer":"B","explanation":"n 为 3 时执行 n * f(2)，f(2) 执行 2 * f(1)，最后得到 6。","topic":"递归执行","tags":[]},{"id":"N29","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"读取文件后自动关闭文件，最推荐使用？","code":null,"options":["open 后忘记 close","with open(...) as f","手动删除文件","只用 read 不打开"],"answer":"B","explanation":"with 上下文管理器能在代码块结束后自动关闭文件。","topic":"with open","tags":[]},{"id":"N30","chapter":"file","difficulty":2,"level":"23","type":"choice","question":"向文件末尾追加内容，应使用哪种模式？","code":null,"options":["r","w","a","x"],"answer":"C","explanation":"a 是追加模式，不会清空原文件。","topic":"文件追加","tags":[]},{"id":"N31","chapter":"file","difficulty":3,"level":"3","type":"choice","question":"读取文本后常用哪一步去掉行末换行？","code":null,"options":["line.strip()","line.sort()","line.split(0)","line += 1"],"answer":"A","explanation":"strip() 去掉首尾空白，包含行末换行符。","topic":"strip","tags":[]},{"id":"N32","chapter":"file","difficulty":3,"level":"3","type":"choice","question":"下面代码的作用是？","code":"count = 0\nwith open(\"data.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        count += 1","options":["统计行数","删除文件","写入一行","读取二进制"],"answer":"A","explanation":"循环每读取一行，count 增加 1，结果是文件行数。","topic":"文件统计","tags":[]},{"id":"N33","chapter":"regex","difficulty":2,"level":"3","type":"choice","question":"正则表达式 \\d 表示？","code":null,"options":["数字字符","字母字符","空格","任意字符"],"answer":"A","explanation":"\\d 匹配一个数字字符。","topic":"d元字符","tags":[]},{"id":"N34","chapter":"regex","difficulty":2,"level":"3","type":"choice","question":"re.search(r\"cat\",\"a cat\") 的结果？","code":null,"options":["匹配对象","字符串 cat","整数","一定为 None"],"answer":"A","explanation":"search 会在字符串中查找并返回匹配对象。","topic":"search","tags":[]},{"id":"N35","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"re.findall(r\"\\d+\",\"A12B3\") 的结果是？","code":null,"options":["[\"12\",\"3\"]","[12,3]","[\"A12B3\"]","[\"1\",\"2\",\"3\"]"],"answer":"A","explanation":"\\d+ 匹配连续数字串，因此得到 12 和 3。","topic":"findall","tags":[]},{"id":"N36","chapter":"regex","difficulty":3,"level":"3","type":"choice","question":"替换字符串中的空白，可使用？","code":null,"options":["re.sub","re.findall","re.match","re.compile"],"answer":"A","explanation":"re.sub 用于替换匹配到的文本。","topic":"sub","tags":[]},{"id":"N37","chapter":"modules_oop","difficulty":2,"level":"23","type":"choice","question":"导入 math 后使用平方根，正确写法是？","code":null,"options":["sqrt(9)",
