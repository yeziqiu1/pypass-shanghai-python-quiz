  else if (action === 'go-stats') setView('stats');
  else if (action === 'go-exam') setView('exam');
  else if (action === 'toggle-kb') { ui.kbAll=false; ui.kbOpen = ui.kbOpen === el.dataset.kb ? '' : el.dataset.kb; render(); }
  else if (action === 'expand-all') { ui.kbAll=true; ui.kbOpen=''; render(); }
  else if (action === 'collapse-all') { ui.kbAll=false; ui.kbOpen=''; render(); }
  else if (action === 'mark-read') { const ch=el.dataset.chapter; state.read[ch]=!state.read[ch]; saveState(); render(); showToast(state.read[ch]?'已标记读完':'已取消已读'); }
  else if (action === 'choose-option') chooseOption(el.dataset.letter);
  else if (action === 'submit-fill') submitFill();
  else if (action === 'reveal-current') revealCurrent();
  else if (action === 'reveal-self') { ui.session.selfRevealed=true; render(); }
  else if (action === 'self-correct') selfJudge(true);
  else if (action === 'self-wrong') selfJudge(false);
  else if (action === 'prev-q') prevQuestion();
  else if (action === 'next-q') nextQuestion();
  else if (action === 'toggle-fav-current') { const q=sessionQuestion(); if(q) toggleFavorite(q.id); }
  else if (action === 'toggle-favorite' && id) toggleFavorite(id);
  else if (action === 'single-question' && id) startSession([id],`单题重练 · ${id}`,'single');
  else if (action === 'master-question' && id) markMastered(id);
  else if (action === 'retry-session') { const s=ui.session; const ids=s.ids.filter(id=>!isMastered(id)); if(!ids.length){showToast('本组题目都已掌握');return;} startSession(ids,s.title,s.mode,s.timeLimit,s.meta||{}); }
  else if (action === 'retry-wrong') { const ids=Object.entries(ui.session.results).filter(([,r])=>r==='wrong').map(([id])=>id); startSession(ids,'本组错题重练','wrong'); }
  else if (action === 'finish-home') { stopSessionTimer(); ui.session=null; ui.view='dashboard'; render(); }
  else if (action === 'exit-session') openModal('退出本组？','当前进度已经记录，未完成题目可以之后继续练习。',`<button class="btn danger" data-action="confirm-exit-session">确认退出</button><button class="btn" data-action="close-modal">继续做题</button>`);
  else if (action === 'confirm-exit-session') { closeModal(); stopSessionTimer(); ui.session=null; ui.view='dashboard'; render(); }
  else if (action === 'settings') openSettings();
  else if (action === 'save-goal') saveGoal();
  else if (action === 'export-data') exportData();
  else if (action === 'import-data') document.getElementById('importFile')?.click();
  else if (action === 'reset-data') openModal('清空全部记录？','所有作答记录、错题、收藏和笔记都会被删除，且无法撤销。建议先导出备份。',`<button class="btn danger" data-action="confirm-reset">确认清空</button><button class="btn" data-action="close-modal">取消</button>`);
  else if (action === 'confirm-reset') { state=defaultState(); saveState(); closeModal(); ui.session=null; ui.view='dashboard'; render(); showToast('记录已清空'); }
  else if (action === 'close-modal') closeModal();
}
document.addEventListener('click', (e) => {
  const nav = e.target.closest('#nav button');
  if (nav) { setView(nav.dataset.view); return; }
  const backdrop = e.target.closest('.modal-backdrop');
  if (backdrop && e.target === backdrop) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (el) { e.preventDefault(); handleAction(el.dataset.action, el); }
});
</script>
<script>
function restoreSearchFocus(selector) {
  const el = document.querySelector(selector);
  if (el) { el.focus(); const n=el.value.length; try{el.setSelectionRange(n,n);}catch(_){} }
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.filter === 'search') {
    ui.practiceSetup.search = t.value;
    clearTimeout(ui.searchTimer);
    ui.searchTimer = setTimeout(()=>{ render(); restoreSearchFocus('#practiceSearch'); }, 280);
  } else if (t.dataset.uiSearch) {
    if (t.dataset.uiSearch === 'wrong') ui.wrongSearch = t.value;
    else if (t.dataset.uiSearch === 'fav') ui.favSearch = t.value;
    else if (t.dataset.uiSearch === 'knowledge') ui.knowledgeSearch = t.value;
    else if (t.dataset.uiSearch === 'notebook') ui.notebookSearch = t.value;
    clearTimeout(ui.searchTimer);
    ui.searchTimer = setTimeout(()=>{ render(); restoreSearchFocus(`[data-ui-search="${t.dataset.uiSearch}"]`); }, 280);
  } else if (Object.prototype.hasOwnProperty.call(t.dataset,'unitNote')) {
    state.unitNotes=state.unitNotes||{}; if(t.value.trim()) state.unitNotes[t.dataset.unitNote]=t.value.trim(); else delete state.unitNotes[t.dataset.unitNote];
    clearTimeout(ui.noteSaveTimer); ui.noteSaveTimer=setTimeout(()=>saveState(),400);
  } else if (Object.prototype.hasOwnProperty.call(t.dataset,'questionNote')) {
    state.notes=state.notes||{}; if(t.value.trim()) state.notes[t.dataset.questionNote]=t.value.trim(); else delete state.notes[t.dataset.questionNote];
    clearTimeout(ui.noteSaveTimer); ui.noteSaveTimer=setTimeout(()=>saveState(),400);
  } else if (Object.prototype.hasOwnProperty.call(t.dataset,'aiInput')) { ui.aiInput=t.value; }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'aiProvider') { applyAIPreset(t.value); }
  else if (t.dataset.knowledgeFilter) { if(t.dataset.knowledgeFilter==='chapter') ui.knowledgeChapter=t.value; else ui.knowledgeReq=t.value; render(); }
  else if (t.dataset.filter && t.dataset.filter !== 'search') { ui.practiceSetup[t.dataset.filter] = t.value; render(); }
  else if (Object.prototype.hasOwnProperty.call(t.dataset,'unitNote')) { state.unitNotes=state.unitNotes||{}; state.unitNotes[t.dataset.unitNote]=t.value.trim(); saveState(); showToast('知识笔记已自动保存'); }
  else if (t.dataset.note) { state.notes[t.dataset.note] = t.value; saveState(); showToast('笔记已保存'); }
  else if (t.id === 'importFile' && t.files?.[0]) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        if (!payload.state || typeof payload.state !== 'object') throw new Error('invalid');
        state = {...defaultState(), ...payload.state, records:payload.state.records||{}, goals:{...defaultState().goals,...(payload.state.goals||{})}, settings:{...defaultState().settings,...(payload.state.settings||{})}, ai:{...defaultState().ai,...(payload.state.ai||{})}, aiHistory:payload.state.aiHistory||[]};
        state.favorites = (state.favorites||[]).filter(id=>questionMap[id]);
        saveState(); closeModal(); render(); showToast('备份导入成功');
      } catch(err) { showToast('导入失败：文件格式不正确'); }
    };
    reader.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (e.target.id === 'aiInput' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAI(e.target.value); return; }
  if (ui.view === 'practice' && ui.session && !ui.session.finished) {
    const q = sessionQuestion();
    if (e.key === 'Enter') {
      if (q?.type === 'fill' && !ui.session.answered) { e.preventDefault(); submitFill(); return; }
      if (ui.session.answered) { e.preventDefault(); nextQuestion(); return; }
    }
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevQuestion(); return; }
    if (e.key === 'ArrowRight' && ui.session.answered) { e.preventDefault(); nextQuestion(); return; }
    if (q?.type === 'choice' && !ui.session.answered) {
      const letter = /^[a-d]$/i.test(e.key) ? e.key.toUpperCase() : /^[1-4]$/.test(e.key) ? 'ABCD'[Number(e.key)-1] : '';
      if (letter) { e.preventDefault(); chooseOption(letter); }
    }
  }
  if (e.key === 'Escape' && ui.session && !ui.session.finished) handleAction('exit-session');
});
window.addEventListener('beforeunload', (e) => {
  if (ui.session && !ui.session.finished) { e.preventDefault(); e.returnValue = ''; }
});

render();
renderNoteDock();
updateNav();
setInterval(() => {
  updateNav();
  updateCountdownLive();
}, 1000);
</script>
