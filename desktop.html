const KNOWLEDGE = {"basic":{"goal":"看懂变量、类型、表达式和输入输出，能判断运算结果。","points":[["数值类型","int 整数、float 浮点数、complex 复数；bool 是 int 的子类，True 相当于 1，False 相当于 0。"],["变量与类型","变量是指向对象的名称；input() 返回字符串；int()、float()、str() 用于常用类型转换。"],["运算符优先级","优先级从高到低常记为：** > 一元正负 > * / // % > + - > 比较 > not > and > or。"],["浮点比较","不要直接用 == 判断两个浮点计算结果是否相等，优先使用 math.isclose(a, b)。"],["输出格式","f\"{x:.2f}\" 保留两位小数；// 是整除并向下取整；% 可用于取余。"]],"traps":["input(\"12\") 得到字符串而不是整数。","0.1 + 0.2 不一定精确等于 0.3。","bool(\"False\") 是 True，因为非空字符串为真。"],"checklist":["能区分 / 与 //","能写 f-string","能判断常见表达式类型","能正确转换用户输入"]},"flow":{"goal":"掌握分支、循环、break/continue 与异常处理，能读程序推结果。","points":[["if 分支","条件按顺序判断，命中一个分支后，后面的 elif 或 else 不再执行。"],["range","range(start, stop, step) 包含 start，不包含 stop；step 可以为负数。"],["while 与 for","for 适合遍历序列和固定次数；while 适合条件驱动或未知次数循环。"],["转移语句","break 结束整个循环；continue 跳过本轮剩余语句，进入下一轮。"],["异常处理","try 放可能出错的代码，except 捕获指定异常；不要用裸 except 掩盖所有问题。"],["循环 else","循环没有被 break 终止时执行 else；这是 Python 特有结构。"]],"traps":["range(5) 是 0 到 4，不包含 5。","while 条件忘记更新会导致死循环。","continue 后面的本轮语句不会执行。"],"checklist":["能写累加累乘","能选对 while/for","能处理 ValueError","能追踪嵌套循环变量"]},"string":{"goal":"熟练进行索引、切片、查找、切分、替换和格式化。","points":[["索引和切片","索引从 0 开始，负索引从 -1 开始；切片 s[a:b:c] 包含 a、不包含 b。"],["常用方法","strip、split、replace、find、count、startswith、endswith、join 等。"],["大小写","upper、lower、capitalize、title、swapcase 返回新字符串，不原地修改。"],["格式化","% 格式、str.format()、f-string 都能格式化；考试中优先掌握 f-string。"],["判断方法","isdigit、isalpha、isalnum、isspace 用于字符类别判断。"]],"traps":["字符串不可变，所有方法都不能改变原字符串。","切片越界通常不报错，索引越界会报错。","split() 不传分隔符时会按任意连续空白切分。"],"checklist":["能逆序切片","能按分隔符切分","能格式化小数","能清理行末换行"]},"list_tuple":{"goal":"掌握列表增删改查、排序和解析式，理解元组不可变。","points":[["列表操作","append 末尾追加；extend 拼接多项；insert 指定位置插入；pop 删除并返回。"],["查找与统计","index 返回首次出现位置；count 统计出现次数；in 判断是否存在。"],["排序","list.sort() 原地排序并返回 None；sorted() 返回新列表。"],["列表解析式","[表达式 for 变量 in 可迭代对象 if 条件]，适合生成和筛选。"],["元组","元组不可变，可解包、切片、count、index；可用于字典键或坐标。"]],"traps":["append([1,2]) 只增加一个元素，extend([1,2]) 增加两个。","[[0]*2]*3 的内层列表会被共享。","sort() 返回 None，不能写 a = a.sort()。"],"checklist":["能区分 append/extend","能用解析式筛选","能完成交换解包","能判断浅复制影响"]},"dict_set":{"goal":"掌握字典键值映射、迭代、计数和集合去重。","points":[["字典访问","d[key] 键不存在会 KeyError；d.get(key, default) 更安全。"],["更新与删除","新增或修改直接赋值；pop、del、clear 用于删除；update 合并或覆盖。"],["迭代","for k in d 遍历键；d.values() 遍历值；d.items() 遍历键值对。"],["分类计数","counts[word] = counts.get(word, 0) + 1 是高频写法。"],["集合","集合无序、不重复，支持 & 交集、| 并集、- 差集、^ 对称差集。"]],"traps":["空集合必须写 set()，{} 是空字典。","列表不能作为字典键，元组元素都可哈希时可以作为键。","直接访问不存在的键会报 KeyError。"],"checklist":["能用 get 计数","能遍历 items","能用集合去重","能判断可哈希类型"]},"function":{"goal":"会定义和调用函数，理解参数、返回值、作用域与可变对象传参。","points":[["定义与返回","def 定义函数；没有 return 时返回 None；return 可以返回多个值并用元组接收。"],["参数类型","位置参数按顺序传值；关键字参数按参数名传值；默认参数必须写在普通参数后。"],["可变参数","*args 收集位置参数为元组；**kwargs 收集关键字参数为字典。"],["作用域","函数内赋值默认产生局部变量；global 修改全局变量，nonlocal 修改外层函数变量。"],["可变对象","列表、字典、集合传入函数后可能被原地修改，是否修改取决于函数内部操作。"]],"traps":["print 只是输出，不等于 return。","默认参数不要使用可变对象作为长期累加容器。","函数内读取全局变量可以，直接赋值需要声明。"],"checklist":["能写默认参数","能解析 return None","能判断列表是否被修改","能说明局部作用域"]},"advanced":{"goal":"掌握 map、filter、sorted、reduce、生成器、装饰器和递归。","points":[["高阶函数","函数可以接收函数或返回函数；map 映射、filter 筛选、sorted 排序、reduce 累积。"],["lambda","lambda 参数: 表达式，适合短小的一次性函数，不能包含多条语句。"],["生成器","含 yield 的函数返回生成器；惰性产生数据，适合处理较大序列。"],["递归","递归必须有基线条件，并确保每次调用逐渐靠近基线条件。"],["装饰器","装饰器接收函数并返回新函数，用于日志、计时、权限等横切功能。"]],"traps":["map/filter 返回迭代器，重复遍历前通常需要 list()。","reduce 在 Python 3 中需从 functools 导入。","递归深度过大可能触发 RecursionError。"],"checklist":["能用 lambda 配合 map/filter","能写阶乘或斐波那契递归","能说明 yield 暂停恢复","能读懂简单装饰器"]},"file":{"goal":"会安全读写文本文件，并进行逐行统计和简单数据分析。","points":[["打开模式","r 只读、w 清空写入、a 追加、b 二进制；文本模式可指定 encoding。"],["安全写法","with open(...) as f 会在代码块结束时自动关闭文件。"],["读取方法","read() 一次读取全部；readline() 读一行；readlines() 读所有行；for line in f 逐行迭代。"],["写入刷新","write() 写入字符串，writelines() 写入字符串序列；flush() 强制缓冲区写入。"],["数据分析","常用 line.strip() 清理换行，用 split 拆字段，用字典计数、求和、求平均。"]],"traps":["w 模式会立即清空已有文件。","readlines 的每行通常保留换行符。","不要用二进制模式直接按文本规则处理编码。"],"checklist":["能使用 with open","能逐行清理","能统计词频","能拆分 CSV 字段"]},"regex":{"goal":"掌握常用正则语法，完成查找、替换、提取文本信息。","points":[["常用符号","\\d 数字、\\w 单词字符、\\s 空白；. 任意单字符；[...] 字符集。"],["数量限定","* 0 或多次，+ 1 或多次，? 0 或 1 次，{m,n} 指定次数范围。"],["锚点与分组","^ 开头、$ 结尾；() 捕获分组，group(n) 取得第 n 组。"],["re 模块","search 扫描查找，match 从开头匹配，findall 返回所有匹配，sub 替换。"],["原始字符串","正则表达式通常写 r\"...\"，避免 Python 字符串转义与正则转义冲突。"]],"traps":["match 不是完全匹配，只是从开头开始尝试；fullmatch 才是全串匹配。","findall 有捕获组时返回组内容而不是整个匹配。","点号默认不匹配换行符。"],"checklist":["能提取数字","能替换连续空白","能写日期匹配","能区分 match/search/findall"]},"modules_oop":{"goal":"会导入标准库和第三方库，理解类、对象、继承及上下文管理。","points":[["导入方式","import 模块；from 模块 import 名称；as 起别名，避免命名冲突。"],["标准库","random、math、calendar、time 等标准库可直接导入。"],["类与对象","class 定义类；__init__ 初始化实例；self 表示当前实例。"],["继承与多态","子类可复用和重写父类方法；不同对象对同一方法可表现不同行为。"],["上下文管理","with 管理文件、数据库连接等资源，离开代码块自动清理。"]],"traps":["模块导入失败通常表示库未安装或路径不正确。","实例属性属于对象，类属性由同类对象共享。","__init__ 负责初始化，不是创建对象的唯一底层步骤。"],"checklist":["能写简单类","能访问实例属性","能使用 import as","能说明封装与继承"]},"db_api":{"goal":"会连接 SQLite、执行 SQL、处理 JSON 和调用 RESTful API。","points":[["连接流程","connect 连接数据库，cursor 创建游标，execute 执行 SQL，fetchone/fetchall 读取。"],["增删改查","INSERT、SELECT、UPDATE、DELETE 是最常用的四类 SQL 操作；提交修改使用 commit。"],["参数化","使用 ? 占位符并传入参数元组，避免拼接用户输入导致 SQL 注入。"],["JSON","json.loads 把 JSON 字符串转 Python 对象；json.dumps 反向转换。"],["API","requests 发送 HTTP 请求，响应可用 resp.json() 获取结构化数据；REST 常用 JSON。"]],"traps":["修改数据库后忘记 commit，会导致部分改动未提交。","fetchall 可能占用较多内存，大结果集应分批处理。","json.load 操作文件对象，json.loads 操作字符串。"],"checklist":["能写 SELECT 查询","能使用参数占位符","能解析 JSON","能关闭数据库连接"]},"gui_viz":{"goal":"理解 tkinter 常见控件和事件，掌握 matplotlib/turtle 基础绘图。","points":[["tkinter 窗口","Tk() 创建窗口，mainloop() 进入事件循环，窗口关闭后程序退出。"],["常见控件","Label 标签、Button 按钮、Entry 单行输入、Text 多行文本、Checkbutton 复选框。"],["布局管理","pack 顺序排布，grid 网格布局，place 坐标定位；同一个父容器不要混用冲突布局。"],["事件绑定","Button 可用 command=函数；更通用的 bind 可绑定键盘、鼠标事件。"],["绘图","turtle 适合简单几何绘图；matplotlib 的 plot/bar/scatter/pie 用于数据可视化。"]],"traps":["tk.mainloop() 会阻塞当前主流程，必须放在界面搭建完成后。","回调函数不要写成立即调用的 f()，command=f 才是传入函数对象。","matplotlib 显示用 show，保存用 savefig。"],"checklist":["能创建窗口和按钮","能使用 grid 布局","能绑定按钮函数","能写折线图基本框架"]}};
const SYLLABUS = [{"chapter":"basic","name":"Python 语言基本语法","units":[{"id":"basic.01","title":"基本语法元素","requirement":"理解","points":["标识符：由字母、数字、下划线组成，不能以数字开头，不能使用关键字，区分大小写。","常量与字面量：整数、浮点数、字符串、布尔值、None 等值的书写形式。","运算符：算术、比较、逻辑、赋值、成员、身份等运算符号。","关键字：if、else、for、while、def、class、import、return、True、False、None 等。"],"example":"name = \"小明\"\nage = 18","trap":"变量名不能用 class、def 等关键字；Python 区分大小写。","keywords":["标识符","常量","关键字"]},{"id":"basic.02","title":"程序书写格式与规则","requirement":"掌握","points":["语句通常一行一条；必要时可用反斜杠续行，或把表达式写在括号中跨行。","缩进表示代码块，同一代码块缩进必须一致；建议每级 4 个空格。","注释以 # 开始，用于解释代码，不参与执行。","Python 对大小写敏感，中文标点不能代替英文标点。"],"example":"if score >= 60:\n    print(\"通过\")","trap":"缩进和英文标点是初学者最常见的语法错误来源。","keywords":["缩进","注释","换行"]},{"id":"basic.03","title":"Python 编程环境","requirement":"掌握","points":["命令行交互环境适合快速验证语句；脚本文件适合保存并运行完整程序。","常见开发环境包括 IDLE、PyCharm、VS Code、Jupyter、Spyder 等。","Python 3.x 是考试环境基线；程序在统一上机平台中完成。"],"example":"python hello.py","trap":"交互环境与脚本环境不是同一概念。","keywords":["IDLE","PyCharm","VS Code"]},{"id":"basic.04","title":"程序的编辑、保存与运行","requirement":"掌握","points":["源程序通常保存为 .py 文件，文件名和路径应符合运行环境要求。","运行时要检查工作目录、解释器、输入数据和输出格式。","调试时优先定位第一条报错，并查看错误类型和出错行。"],"example":"print(\"Hello, Python\")","trap":"程序读文件失败时，要检查相对路径和当前工作目录。","keywords":["运行","保存","调试"]},{"id":"basic.05","title":"输入 input() 与 eval()","requirement":"掌握","points":["input() 读取一行输入，总是返回字符串。","需要整数或浮点数时使用 int()、float() 转换。","eval() 能把字符串按 Python 表达式求值，但安全风险较高，考试中需理解其结果。"],"example":"age = int(input(\"年龄：\"))","trap":"不要对不可信输入直接使用 eval()。","keywords":["input","eval","输入"]},{"id":"basic.06","title":"输出 print()","requirement":"掌握","points":["print() 可输出多个对象，默认以空格分隔，以换行结尾。","sep 控制分隔符，end 控制结尾；例如 print(a, b, sep=\",\")。","格式化输出可使用 %、format() 或 f-string。"],"example":"print(\"总分\", 95, sep=\"：\")","trap":"print() 是输出，不负责把值返回给函数调用处。","keywords":["print","sep","end","格式化"]},{"id":"basic.07","title":"基本数据类型","requirement":"掌握","points":["int 整数、float 浮点数、complex 复数、str 字符串、bool 布尔值、NoneType 空值。","type(x) 查看对象类型，isinstance(x, T) 判断对象是否属于某类型。","bool 是 int 的子类；True 等价于整数 1，False 等价于 0。"],"example":"print(type(3.14), isinstance(1, int))","trap":"字符串 \"10\" 和整数 10 类型不同。","keywords":["int","float","str","bool","None"]},{"id":"basic.08","title":"变量初始化、赋值与类型转换","requirement":"掌握","points":["变量是指向对象的名称，赋值语句把右侧对象绑定给左侧名称。","多重赋值：a, b = 1, 2；交换：a, b = b, a。","类型转换使用 int()、float()、str()、bool() 等函数。"],"example":"a, b = 1, 2\na, b = b, a","trap":"字符串形式的数字要转换后才能参与算术运算。","keywords":["赋值","转换","变量"]},{"id":"basic.09","title":"运算符种类、功能、优先级与结合性","requirement":"理解","points":["算术运算符：+ - * / // % **。","比较运算符：== != > >= < <=，结果是 bool。","逻辑运算符：and、or、not，具有短路求值特性。","优先级常见顺序：** > 乘除整除取模 > 加减 > 比较 > not > and > or。"],"example":"print(1 + 2 * 3 ** 2)","trap":"连续幂运算和连续比较的结合顺序容易出错。","keywords":["运算符","优先级","结合性"]},{"id":"basic.10","title":"比较、赋值和逻辑运算规则","requirement":"掌握","points":["== 判断值是否相等，is 判断是否为同一对象。","赋值运算符包括 =、+=、-=、*=、/=、//=、%=、**= 等。","and：两边都为真才为真；or：至少一边为真即为真；not 取反。","常见假值：False、None、0、0.0、空字符串、空列表、空字典、空集合。"],"example":"print(not 0, bool([]), 3 > 2 and 1 < 5)","trap":"链式比较 1 <= x < 5 等价于 1 <= x and x < 5。","keywords":["比较","赋值","and","or","not"]},{"id":"basic.11","title":"表达式与混合类型运算","requirement":"理解","points":["表达式由常量、变量、运算符和函数调用等组成，最终产生一个值。","混合数值运算会自动向更通用的类型转换，例如 int 与 float 运算得到 float。","运算顺序同时受括号、优先级和结合性影响。","错误理解结果类型是选择题常见陷阱。"],"example":"print(10 / 2, 10 // 2, type(10 / 2))","trap":"/ 的结果一定是 float；// 的结果类型取决于参与对象。","keywords":["表达式","混合运算","类型转换"]}]},{"chapter":"flow","name":"结构和语句","units":[{"id":"flow.01","title":"程序设计基本方法与计算思维","requirement":"理解","points":["把问题拆分为输入、处理、输出三个部分。","常用计算方法：枚举、累加、累乘、交换、查找、排序、分类统计。","先写清算法步骤，再翻译为 Python 语句，能减少逻辑错误。"],"example":"sum = 0\nfor x in nums:\n    sum += x","trap":"不要只记程序外形，要能说明每一步解决什么问题。","keywords":["算法","计算思维","输入处理输出"]},{"id":"flow.02","title":"赋值语句与复合赋值","requirement":"掌握","points":["赋值语句计算右侧表达式，再把结果绑定给左侧变量。","+= 等复合赋值可以简化“读取、运算、写回”的过程。","赋值表达式本身不作为普通表达式的返回值使用。"],"example":"count += 1","trap":"x = y 与 x == y 完全不同。","keywords":["赋值","+=","变量"]},{"id":"flow.03","title":"if、if-elif-else 与嵌套选择","requirement":"掌握","points":["if 条件为真时执行对应代码块。","if-elif-else 自上而下判断，最多执行一个分支。","选择结构可以嵌套，但要注意缩进和条件覆盖范围。"],"example":"if score >= 90:\n    print(\"优秀\")\nelif score >= 60:\n    print(\"合格\")\nelse:\n    print(\"不合格\")","trap":"多个独立 if 可能执行多次，if-elif 只会命中一个分支。","keywords":["if","elif","else","嵌套"]},{"id":"flow.04","title":"while 循环","requirement":"掌握","points":["while 在条件为真时重复执行循环体。","循环变量必须在循环体内发生变化，否则可能死循环。","while True 配合 break 常用于未知循环次数的输入处理。"],"example":"while n > 0:\n    total += n\n    n -= 1","trap":"循环结束后，循环变量的值通常是使条件失败的值。","keywords":["while","循环变量","死循环"]},{"id":"flow.05","title":"for 循环与 range()","requirement":"掌握","points":["for 用于遍历字符串、列表、元组、字典、range 等可迭代对象。","range(stop)、range(start, stop)、range(start, stop, step) 均不含 stop。","步长可以为负数，用于倒序生成整数。"],"example":"for i in range(5, 0, -1):\n    print(i)","trap":"range 返回范围对象，不是列表。","keywords":["for","range","遍历"]},{"id":"flow.06","title":"循环嵌套","requirement":"掌握","points":["外层循环每执行一次，内层循环通常完整执行一轮。","二维图形、乘法表、矩阵遍历等常用嵌套循环。","循环变量不要重复覆盖导致逻辑混乱。"],"example":"for i in range(1, 4):\n    for j in range(1, i + 1):\n        print(j, end=\"\")\n    print()","trap":"内层变量与外层变量要区分清楚。","keywords":["嵌套循环","二维","乘法表"]},{"id":"flow.07","title":"无限循环、break 与 continue","requirement":"理解","points":["break 立即结束当前整个循环。","continue 跳过本轮剩余语句，进入下一次迭代。","循环可以配合 else：未因 break 退出时执行 else。"],"example":"for x in nums:\n    if x < 0:\n        continue\n    print(x)","trap":"break/continue 只影响所在层循环，嵌套时要注意作用范围。","keywords":["break","continue","循环else"]},{"id":"flow.08","title":"语法错误与逻辑错误","requirement":"掌握","points":["语法错误程序无法运行，常见于缺少冒号、括号不配对、缩进错误。","逻辑错误程序能运行但结果错误，常见于条件写反、边界漏判、初始值错误。","调试要构造小数据、打印中间结果并逐步验证。"],"example":"if x > 0\n    print(x)","trap":"报错不一定出现在真正出错的行，应结合调用栈判断。","keywords":["SyntaxError","逻辑错误","调试"]},{"id":"flow.09","title":"try-except 异常处理与断言","requirement":"知道","points":["try 中放可能抛出异常的代码，except 捕获并处理指定异常。","常见异常：ValueError、ZeroDivisionError、KeyError、IndexError、FileNotFoundError。","assert 条件用于断言，条件不成立时抛出 AssertionError。"],"example":"try:\n    n = int(input())\nexcept ValueError:\n    print(\"请输入整数\")","trap":"except 应尽量指定异常类型，避免隐藏真正的问题。","keywords":["异常","try-except","assert"]},{"id":"flow.10","title":"利用人工智能辅助程序调试","requirement":"知道","points":["可以把错误信息、预期结果、实际结果和最小代码片段提供给 AI。","AI 给出的解释仍需通过运行、测试和边界数据验证。","不要把整份含隐私的数据直接发送给外部服务。"],"example":"把“报错类型 + 出错行 + 输入 + 预期输出”一起说明，更容易获得有效帮助。","trap":"AI 回答可能出错，尤其是版本差异和边界条件。","keywords":["AI调试","错误信息","验证"]}]},{"chapter":"string","name":"字符串","units":[{"id":"string.01","title":"字符串界定符","requirement":"掌握","points":["单引号、双引号都可以表示字符串，三引号可表示多行字符串。","引号需要成对出现；字符串内部引号可通过不同类型引号或转义符处理。","空字符串写作 \"\" 或 ''，长度为 0。"],"example":"s1 = \"Python\"\ns2 = '程序设计'","trap":"中文引号“”不是字符串界定符。","keywords":["字符串","引号","三引号"]},{"id":"string.02","title":"字符串操作：连接、重复、索引、切片、转义","requirement":"掌握","points":["+ 连接字符串，* 重复字符串。","索引从 0 开始，负索引从右往左；越界索引会报 IndexError。","切片 s[start:stop:step] 包含 start、不包含 stop，步长可为负。","转义字符：\\n 换行、\\t 制表、\\\\ 反斜杠、\\\" 双引号。"],"example":"s = \"Python\"\nprint(s[1:4], s[::-1])","trap":"字符串不可变，不能通过索引直接赋值修改字符。","keywords":["索引","切片","连接","转义"]},{"id":"string.03","title":"字符串格式化：%、format() 与 f-string","requirement":"掌握","points":["% 格式化：%s、%d、%f、%.2f。","format() 使用 {} 占位，可指定索引、名称和格式。","f-string 在字符串前加 f，可直接嵌入变量和表达式。","常用格式：:.2f 两位小数、:>10 右对齐、:03d 三位补零。"],"example":"name = \"小明\"\nscore = 92.5\nprint(f\"{name}: {score:.1f}\")","trap":"格式说明符中的 d 用于整数，f 用于浮点数。","keywords":["%格式化","format","f-string"]},{"id":"string.04","title":"字符串常用方法与统计","requirement":"掌握","points":["len、count、find、index、startswith、endswith、in 用于查询和统计。","strip、lstrip、rstrip 删除空白；replace 替换内容。","split 切分字符串；join 把字符串序列连接成一个字符串。","upper、lower、capitalize、title、swapcase 处理大小写。"],"example":"words = \"a,b,c\".split(\",\")\nprint(\"-\".join(words))","trap":"字符串方法通常返回新字符串，不会修改原字符串。","keywords":["split","join","replace","strip"]},{"id":"string.05","title":"字符串与列表的相互转换","requirement":"掌握","points":["list(s) 把字符串拆成单字符列表。","split() 按分隔符把字符串转为字符串列表。","join() 把字符串列表合并成一个字符串。","转换时要注意元素类型，join 的元素必须都是字符串。"],"example":"chars = list(\"Python\")\ntext = \"\".join(chars)","trap":"join 不能直接连接整数列表，应先使用 map(str, nums)。","keywords":["list","split","join","转换"]}]},{"chapter":"list_tuple","name":"列表与元组","units":[{"id":"list_tuple.01","title":"列表的概念和特点","requirement":"掌握","points":["列表用 [] 定义，有序、可变，可保存不同类型元素。","列表元素通过索引访问，支持切片、遍历、成员判断。","列表可以嵌套，用于保存表格或矩阵。"],"example":"scores = [88, 92, 76]\nprint(scores[0], scores[-1])","trap":"列表元素可变不等于列表整体自动排序。","keywords":["列表","可变","有序"]},{"id":"list_tuple.02","title":"列表元素增删改查与统计","requirement":"掌握","points":["append 末尾追加一个元素；extend 拼接多个元素；insert 指定位置插入。","remove 删除首个指定值；pop 删除并返回指定位置元素；del 删除元素或切片。","index 查询位置；count 统计次数；in 判断元素是否存在。","直接通过索引或切片修改元素。"],"example":"nums = [1, 2, 3]\nnums.append(4)\nnums.insert(0, 0)","trap":"append 与 extend 的参数和结果不同。","keywords":["append","extend","insert","remove","pop"]},{"id":"list_tuple.03","title":"列表排序、反转与深浅复制","requirement":"掌握","points":["sort() 原地排序并返回 None；sorted() 返回新列表。","reverse() 原地反转；切片 [::-1] 返回反转后的新列表。","copy() 或 list() 可做浅复制；copy.deepcopy() 做深复制。","嵌套列表浅复制时，内层对象仍可能被共享。"],"example":"a = [3, 1, 2]\nb = sorted(a, reverse=True)","trap":"[[0]*2]*3 会共享同一个内层列表。","keywords":["sort","sorted","reverse","浅复制","深复制"]},{"id":"list_tuple.04","title":"enumerate() 与列表解析式","requirement":"掌握","points":["enumerate(iterable, start=0) 同时得到索引和元素。","列表解析式格式：[表达式 for 变量 in 可迭代对象 if 条件]。","列表解析式适合生成、筛选和转换列表。","复杂逻辑优先使用普通循环，避免表达式难读。"],"example":"squares = [x*x for x in range(1, 6) if x % 2 == 1]","trap":"解析式的 if 是筛选条件，不是分值判断。","keywords":["enumerate","列表解析式"]},{"id":"list_tuple.05","title":"元组的概念、操作与转换","requirement":"掌握","points":["元组用 () 定义，有序但不可变；单元素元组需写 (x,)。","支持索引、切片、count、index、len、in 等操作。","tuple(list) 与 list(tuple) 可以相互转换。","元组解包：a, b = (1, 2)；星号可收集剩余元素。"],"example":"point = (3, 5)\nx, y = point","trap":"修改元组元素会报 TypeError；元组内若含可变对象，该对象本身仍可修改。","keywords":["元组","不可变","解包","转换"]}]},{"chapter":"dict_set","name":"字典与集合","units":[{"id":"dict_set.01","title":"字典的概念和特点","requirement":"掌握","points":["字典用 {} 定义，以“键: 值”保存映射关系。","键必须可哈希且通常唯一，值可以是任意对象。","字典按插入顺序保存键值对，可通过键快速查询。","空字典写作 {}，不是空集合。"],"example":"student = {\"name\": \"小明\", \"score\": 92}","trap":"列表不能作为字典键，元组在元素都可哈希时可作为键。","keywords":["字典","键值对","可哈希"]},{"id":"dict_set.02","title":"字典清空、合并、更新、复制和删除","requirement":"掌握","points":["clear() 清空，update() 合并或覆盖键值，copy() 浅复制。","pop(key, default) 删除并返回值；popitem() 删除最后一个键值对。","del d[key] 删除指定键；键不存在会引发 KeyError。","深复制使用 copy.deepcopy()。"],"example":"d1 = {\"a\": 1}\nd1.update({\"b\": 2})","trap":"d.copy() 只复制外层映射，嵌套对象仍可能共享。","keywords":["update","pop","copy","clear"]},{"id":"dict_set.03","title":"字典键、值、键值对的迭代","requirement":"掌握","points":["for key in d 默认遍历键。","d.keys()、d.values()、d.items() 分别返回键、值、键值对视图。","for key, value in d.items() 是同时处理键和值的高频写法。","遍历时直接改变字典大小可能引发 RuntimeError。"],"example":"for k, v in scores.items():\n    print(k, v)","trap":"items() 每次产生二元组，可用两个变量解包。","keywords":["keys","values","items","迭代"]},{"id":"dict_set.04","title":"字典查询与分类计数","requirement":"掌握","points":["d[key] 查询但键不存在会报错；d.get(key, default) 更安全。","in 可判断键是否存在，不会按值查找。","分类计数模板：counts[word] = counts.get(word, 0) + 1。","排序统计结果可用 sorted(d.items(), key=lambda x: x[1], reverse=True)。"],"example":"counts[word] = counts.get(word, 0) + 1","trap":"len(d) 返回键值对数量，不是所有值数量。","keywords":["get","分类计数","排序"]},{"id":"dict_set.05","title":"可迭代对象与字典转换","requirement":"理解","points":["dict() 可把由二元组组成的可迭代对象转换为字典。","dict(zip(keys, values)) 可把两个序列配对成字典。","字典可转换为 keys、values、items 视图，再转列表或参与排序。","zip 长度不一致时以最短序列为准。"],"example":"d = dict(zip([\"a\", \"b\"], [1, 2]))","trap":"视图对象会随字典变化，不等同于静态列表。","keywords":["dict","zip","视图","排序"]},{"id":"dict_set.06","title":"集合的概念、特点和去重","requirement":"知道","points":["集合用 set() 或 {元素, ...} 定义，无序、不重复。","set() 是空集合；{} 是空字典。","集合元素必须可哈希，列表不能直接放入集合。","set(seq) 常用于快速去重。"],"example":"nums = set([1, 2, 2, 3])","trap":"集合无序，不能依赖固定的输出顺序。","keywords":["集合","set","去重"]},{"id":"dict_set.07","title":"集合运算与常用方法","requirement":"知道","points":["交集 &、并集 |、差集 -、对称差集 ^。","add、remove、discard、pop、clear 管理集合元素。","issubset、issuperset、isdisjoint 判断集合关系。","集合适合去重和成员快速判断。"],"example":"print({1, 2} & {2, 3})","trap":"remove 不存在元素会报错，discard 更安全。","keywords":["交集","并集","差集"]}]},{"chapter":"file","name":"文件","units":[{"id":"file.01","title":"文本文件、二进制文件与编码","requirement":"理解","points":["文本文件按字符和编码保存，适合 txt、csv；二进制文件按字节保存，适合图片、音频等。","常见编码有 UTF-8、GBK；读写时的 encoding 必须与实际编码一致。","文本模式读写 str，二进制模式读写 bytes。","文件路径可以是绝对路径或相对路径，相对路径基于当前工作目录。"],"example":"open(\"data.txt\", \"r\", encoding=\"utf-8\")","trap":"编码不匹配会出现乱码或 UnicodeDecodeError。","keywords":["文本文件","二进制文件","UTF-8","GBK"]},{"id":"file.02","title":"文件的打开、关闭与上下文管理","requirement":"掌握","points":["open(path, mode, encoding=...) 打开文件并返回文件对象。","r 只读、w 清空写入、a 追加、x 独占创建、b 二进制、+ 读写。","close() 关闭文件；with open(...) as f 会自动关闭资源。","文件最好使用 with 管理，异常时也能正确关闭。"],"example":"with open(\"data.txt\", encoding=\"utf-8\") as f:\n    text = f.read()","trap":"w 模式打开文件会立即截断原内容。","keywords":["open","close","with","文件模式"]},{"id":"file.03","title":"文件指针定位","requirement":"理解","points":["read() 从当前指针位置读取，readline() 读一行，readlines() 读所有行。","tell() 返回当前指针位置，seek(offset, whence) 移动指针。","文本文件 seek 的偏移通常由 tell 返回值产生；二进制文件可按字节移动。","读完文件后指针位于末尾，再读取不会得到内容，需先 seek(0)。"],"example":"f.seek(0)\ntext = f.read()","trap":"不要把字符位置与字节位置混为一谈。","keywords":["tell","seek","文件指针"]},{"id":"file.04","title":"文件的读取、写入与追加","requirement":"掌握","points":["read(size) 读取指定数量字符或全部内容；readline 逐行读。","write(s) 写入字符串；writelines(lines) 写入字符串序列。","追加模式 a 不会清空原文件，新内容写在末尾。","换行符 \\n 不会自动添加，writelines 也不会逐项自动换行。"],"example":"with open(\"out.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"你好\\n\")","trap":"write 的返回值是写入字符数，不是文件内容。","keywords":["read","write","writelines","追加"]},{"id":"file.05","title":"基于文件的数据分析","requirement":"掌握","points":["逐行读取可降低大文件的内存占用。","line.strip() 去除行末换行和首尾空白，split() 拆分字段。","常见任务：统计行数、词频、求和、求平均、筛选记录、排序输出。","CSV 可用 csv 模块的 reader、DictReader、writer。"],"example":"for line in f:\n    fields = line.strip().split(\",\")","trap":"不要把标题行当普通数据参与数值计算。","keywords":["逐行","strip","split","CSV","统计"]}]},{"chapter":"regex","name":"正则表达式","units":[{"id":"regex.01","title":"正则表达式基本语法规则","requirement":"理解","points":["字符类：\\d 数字、\\w 单词字符、\\s 空白、. 任意单字符（默认不含换行）。","字符集：[abc]、[a-z]、[^0-9]；常用快捷类也可写在集合中。","量词：* 0 次或多次、+ 1 次或多次、? 0 或 1 次、{m,n} 指定次数。","锚点：^ 开头、$ 结尾；分组：()；选择：|。"],"example":"r\"^\\d{4}-\\d{2}-\\d{2}$\"","trap":"贪婪量词默认尽可能多匹配；点号默认不匹配换行。","keywords":["字符类","量词","锚点","分组"]},{"id":"regex.02","title":"re 模块匹配、搜索与替换","requirement":"理解","points":["re.match 从字符串开头匹配；re.search 扫描整个字符串。","re.fullmatch 要求整个字符串完全匹配。","re.findall 返回所有匹配；re.finditer 返回匹配对象迭代器。","re.sub 替换匹配文本；re.split 按正则切分。"],"example":"import re\nre.findall(r\"\\d+\", \"A12B345\")","trap":"match 不是 fullmatch，只要求从开头开始匹配。","keywords":["re.match","re.search","re.findall","re.sub"]},{"id":"regex.03","title":"利用正则提取特定文本信息","requirement":"理解","points":["捕获组 () 可提取局部内容，group(1)、group(2) 获取分组。","命名分组 (?P<name>...) 可通过 group(\"name\") 读取，更易维护。","findall 含捕获组时返回组内容，不含捕获组时返回完整匹配。","复杂文本可先用 finditer 获取 Match 对象，再访问 group。"],"example":"m = re.search(r\"(\\d{4})-(\\d{2})\", \"日期 2026-09\")\nprint(m.group(1))","trap":"正则字符串建议加前缀 r，避免 Python 转义和正则转义混淆。","keywords":["捕获组","group","提取","findall"]}]},{"chapter":"function","name":"函数","units":[{"id":"function.01","title":"函数定义、返回值与函数体","requirement":"掌握","points":["使用 def 函数名(参数): 定义函数，函数体通过缩进表示。","return 返回值并结束函数；没有 return 时默认返回 None。","return a, b 实际返回元组；可解包接收多个返回值。","函数命名应清晰，参数列表和返回类型应明确。"],"example":"def add(a, b):\n    return a + b","trap":"print() 只输出，不等于 return。","keywords":["def","return","函数体"]},{"id":"function.02","title":"匿名函数 lambda","requirement":"理解","points":["lambda 参数: 表达式 用于定义简短的匿名函数。","lambda 自动返回表达式结果，不能写多条语句。","常与 sorted、map、filter 等函数配合。"],"example":"items.sort(key=lambda x: x[1], reverse=True)","trap":"lambda 中不适合写复杂逻辑，复杂逻辑应使用 def。","keywords":["lambda","匿名函数"]},{"id":"function.03","title":"位置参数、默认参数与关键字参数","requirement":"知道","points":["位置参数按调用顺序一一对应。","默认参数在定义时提供默认值，通常放在普通参数之后。","关键字参数按参数名传递，调用更清晰。","默认参数不要使用可变对象作为长期容器，避免调用间共享状态。"],"example":"def power(x, n=2):\n    return x ** n","trap":"位置参数与关键字参数混用时，位置参数必须在前。","keywords":["位置参数","默认参数","关键字参数"]},{"id":"function.04","title":"可变参数与变长参数传递","requirement":"理解","points":["*args 把多余位置参数收集为元组。","**kwargs 把多余关键字参数收集为字典。","调用时 *items 可解包序列，**d 可解包字典。","参数顺序通常为：普通参数、*args、默认参数、**kwargs。"],"example":"def f(*args, **kwargs):\n    print(args, kwargs)","trap":"args 和 kwargs 只是常用名称，关键是前面的 * 和 **。","keywords":["*args","**kwargs","解包"]},{"id":"function.05","title":"变量作用域","requirement":"理解","points":["函数内部赋值默认创建局部变量。","函数内可直接读取全局变量，但直接赋值会产生新的局部变量。","global 声明修改模块级变量；nonlocal 声明修改最近外层函数变量。","参数和返回值通常比依赖全局变量更安全。"],"example":"def f():\n    global count\n    count += 1","trap":"函数内“只读全局”和“修改全局”的规则不同。","keywords":["作用域","global","nonlocal"]}]},{"chapter":"advanced","name":"高阶函数、生成器与递归","units":[{"id":"advanced.06","title":"函数式编程与高阶函数","requirement":"理解","points":["函数可以作为参数传入，也可以作为返回值返回。","map(func, iterable) 对每个元素做映射。","filter(func, iterable) 保留函数结果为真的元素。","sorted(iterable, key=func) 按指定键排序。","functools.reduce(func, iterable, initial) 对元素做累积。"],"example":"list(map(lambda x: x * 2, [1, 2, 3]))","trap":"map、filter 返回迭代器，需要时用 list 转换。","keywords":["map","filter","sorted","reduce","高阶函数"]},{"id":"advanced.07","title":"生成器","requirement":"知道","points":["含 yield 的函数是生成器函数，调用后返回生成器对象。","生成器按需产生数据，适合较大序列和惰性计算。","next(gen) 获取下一个值，耗尽后抛出 StopIteration。","生成器表达式与列表解析式语法相似，但使用圆括号。"],"example":"def nums():\n    yield 1\n    yield 2","trap":"生成器只能顺序消费一次，不能像列表反复索引。","keywords":["yield","生成器","惰性"]},{"id":"advanced.08","title":"装饰器","requirement":"知道","points":["装饰器接收函数并返回一个新函数或可调用对象。","@decorator 语法糖等价于 f = decorator(f)。","装饰器常用于日志、计时、权限检查和缓存。","带参数的装饰器需要多一层函数嵌套。"],"example":"def deco(f):\n    def wrapper(*args, **kwargs):\n        return f(*args, **kwargs)\n    return wrapper","trap":"装饰器不要忘记返回 wrapper 函数。","keywords":["装饰器","@","wrapper"]},{"id":"advanced.09","title":"递归的定义、调用与执行","requirement":"理解","points":["递归函数在函数体内调用自身。","必须有基线条件，并确保每次递归向基线条件靠近。","递归常用于阶乘、斐波那契、目录遍历、分治问题。","递归层数过深会触发 RecursionError，大问题可改用迭代或记忆化。"],"example":"def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n - 1)","trap":"递归调用前后语句的执行顺序是理解重点。","keywords":["递归","基线条件","RecursionError"]}]},{"chapter":"modules_oop","name":"面向对象与 Python 生态","units":[{"id":"oop.01","title":"面向对象概念：类、属性、方法","requirement":"知道","points":["类是对一类对象的抽象描述，对象是类的实例。","属性描述对象状态，方法描述对象行为。","类名通常采用大驼峰命名法。","实例方法通过 self 访问当前实例的属性和方法。"],"example":"class Student:\n    def __init__(self, name):\n        self.name = name","trap":"类属性由同类对象共享，实例属性属于具体对象。","keywords":["类","对象","属性","方法"]},{"id":"oop.02","title":"访问控制与类实例创建","requirement":"知道","points":["单下划线 _name 表示内部使用，双下划线 __name 会触发名称改写。","创建实例：对象 = 类名(参数)。","__init__ 在实例创建后执行，用于初始化实例属性。","实例可以动态增加属性，但应保持结构清晰。"],"example":"p = Student(\"小明\")\nprint(p.name)","trap":"__init__ 不应返回非 None 值。","keywords":["__init__","self","实例","访问控制"]},{"id":"oop.03","title":"封装、继承与多态","requirement":"知道","points":["封装：把数据和操作数据的方法组织在类中，并控制访问。","继承：子类复用父类属性和方法，可重写父类方法。","super() 可调用父类方法，常用于扩展初始化。","多态：不同对象响应同名方法时表现出不同行为。"],"example":"class Dog(Animal):\n    def speak(self):\n        return \"汪汪\"","trap":"子类重写方法时，方法名和参数应保持兼容。","keywords":["封装","继承","多态","super"]},{"id":"eco.01","title":"库的模块化架构和管理","requirement":"理解","points":["模块是 .py 文件，包是组织多个模块的目录。","模块可包含变量、函数、类和可执行语句。","if __name__ == \"__main__\": 用于区分直接运行与作为模块导入。","包和模块让程序结构清晰、便于复用。"],"example":"from math import sqrt","trap":"导入模块不会自动删除同名变量，但可能覆盖名称。","keywords":["模块","包","__name__"]},{"id":"eco.02","title":"setup.py、whl 与 exe 安装方法","requirement":"掌握","points":["pip install 包名 安装第三方库；pip uninstall 包名 卸载。","whl 是 Python 二进制分发包，可用 pip 安装。","setup.py 是传统项目打包配置之一，用于构建和安装包。","exe 是 Windows 可执行文件，部分第三方工具可将 Python 程序打包为 exe。"],"example":"pip install requests","trap":"联网安装前要注意源、版本和依赖兼容性。","keywords":["pip","setup.py","whl","exe"]},{"id":"eco.03","title":"import、from、as 与 with","requirement":"掌握","points":["import module 导入整个模块，通过 module.name 访问。","from module import name 导入指定对象。","import module as alias 为模块起别名。","with 管理文件、数据库连接等资源，离开代码块自动清理。"],"example":"import math as m\nprint(m.sqrt(9))","trap":"from module import * 会污染命名空间，不推荐。","keywords":["import","from","as","with"]},{"id":"eco.04","title":"标准库 random、math、calendar、time","requirement":"掌握","points":["random：random、randint、choice、shuffle、sample、seed。","math：sqrt、pi、e、ceil、floor、pow、sin、cos。","calendar：isleap、month、monthcalendar、weekday。","time：time、sleep、strftime、localtime。"],"example":"import random\nprint(random.randint(1, 6))","trap":"random.randint(a,b) 包含两端，randrange 不含终点。","keywords":["random","math","calendar","time"]},{"id":"eco.05","title":"第三方库 jieba、wordcloud、openpyxl、Pillow、matplotlib","requirement":"理解","points":["jieba 用于中文分词，常用 lcut、cut。","wordcloud 根据词频生成词云，可结合中文分词使用。","openpyxl 读写 Excel xlsx 文件，通过工作簿、工作表和单元格操作。","Pillow 处理图片，常用打开、缩放、裁剪、旋转、保存。","matplotlib 用于数据可视化，常用 plot、bar、scatter、pie、show。"],"example":"import matplotlib.pyplot as plt\nplt.plot([1, 2, 3], [2, 4, 3])\nplt.show()","trap":"第三方库通常需要先安装；字体和路径是中文图表常见问题。","keywords":["jieba","wordcloud","openpyxl","Pillow","matplotlib"]}]},{"chapter":"db_api","name":"数据库与 API 应用","units":[{"id":"db.01","title":"关系型数据库与 SQLite 基础","requirement":"理解","points":["关系型数据库以表组织数据，表由行和列组成，主键用于唯一标识记录。","常见 SQL：CREATE、INSERT、SELECT、UPDATE、DELETE。","WHERE 筛选条件，ORDER BY 排序，GROUP BY 分组，LIMIT 限制数量。","SQLite 轻量、无独立服务器，适合本地文件和教学应用。"],"example":"SELECT name, score FROM student WHERE score >= 60 ORDER BY score DESC","trap":"字符串和日期条件通常要加引号，字段名单引号规则依数据库而定。","keywords":["SQL","表","SELECT","SQLite"]},{"id":"db.02","title":"数据库连接、游标与关闭","requirement":"理解","points":["sqlite3.connect(path) 连接数据库并返回 Connection 对象。","conn.cursor() 创建游标，用于执行 SQL 和读取结果。","修改数据后调用 conn.commit() 提交。","操作完成后关闭游标和连接，释放资源。"],"example":"import sqlite3\nconn = sqlite3.connect(\"school.db\")\ncur = conn.cursor()","trap":"连接成功不代表 SQL 正确；异常时应确保关闭资源。","keywords":["connect","cursor","commit","close"]},{"id":"db.03","title":"execute() 与查询结果读取","requirement":"理解","points":["cur.execute(sql, params) 执行一条 SQL，params 是参数序列。","fetchone() 返回下一行，fetchall() 返回剩余所有行，fetchmany(n) 返回若干行。","查询结果通常以元组表示，可用索引或解包访问字段。","INSERT、UPDATE、DELETE 后需要 commit。"],"example":"cur.execute(\"SELECT * FROM student WHERE age > ?\", (18,))\nrows = cur.fetchall()","trap":"查询语句使用参数化占位符，不要直接拼接用户输入。","keywords":["execute","fetchone","fetchall","参数化"]},{"id":"api.01","title":"JSON 数据类型及转换","requirement":"理解","points":["JSON 支持对象、数组、字符串、数字、布尔值和 null。","json.loads 把 JSON 字符串转为 Python 对象，json.dumps 反向转换。","json.load 从文件对象读取，json.load 后面不再加 s；json.dump 写入文件。","ensure_ascii=False 可保留中文；indent 用于美化输出。"],"example":"data = json.loads('{\"name\": \"小明\"}')\ntext = json.dumps(data, ensure_ascii=False)","trap":"JSON 对象转换后通常是字典，数组转换后是列表。","keywords":["json","loads","dumps","ensure_ascii"]},{"id":"api.02","title":"开源人工智能 API 的调用","requirement":"知道","points":["调用 API 通常需要请求地址、请求方法、请求头、模型名和请求参数。","鉴权常用 Authorization: Bearer <API Key> 头。","响应可能是 JSON，需要解析并提取生成文本或错误信息。","API Key 不应硬编码到公开代码中，也不应随意分享。"],"example":"POST /chat/completions\nAuthorization: Bearer <API_KEY>","trap":"浏览器直连第三方 API 可能受跨域、网络和密钥安全限制。","keywords":["API","API Key","鉴权","JSON响应"]},{"id":"api.03","title":"微服务 API 的 RESTful 实现","requirement":"理解","points":["REST 使用资源地址和 HTTP 方法表达操作：GET 查询、POST 新增、PUT/PATCH 更新、DELETE 删除。","常见状态码：200、201、400、401、403、404、500。","请求和响应通常使用 JSON。","RESTful 强调资源化命名、无状态交互和统一接口。"],"example":"GET /students?age=18\nPOST /students","trap":"状态码 200 只说明请求成功，不代表业务结果一定符合预期。","keywords":["RESTful","GET","POST","状态码"]},{"id":"api.04","title":"FastAPI、Django、Flask、Tornado 等框架","requirement":"理解","points":["Flask 轻量灵活，适合小型 API。","FastAPI 强调类型提示、数据校验和自动文档。","Django 功能完整，适合较大 Web 项目；Django REST Framework 常用于 API。","Tornado 支持异步网络和高并发场景。"],"example":"from flask import Flask\napp = Flask(__name__)","trap":"考试通常要求理解框架用途和路由/请求响应基本结构，不要求掌握全部细节。","keywords":["Flask","FastAPI","Django","Tornado"]}]},{"chapter":"gui_viz","name":"桌面 GUI 与图形绘制","units":[{"id":"gui.01","title":"tkinter 常见控件","requirement":"理解","points":["Label 标签、Button 按钮、Entry 单行输入、Text 多行文本。","Radiobutton 单选、Checkbutton 复选、Listbox 列表、Combobox 下拉框。","控件通过 text、width、height、font、fg、bg、state 等属性设置外观和状态。","控件通常创建后还要通过布局管理器放置到窗口中。"],"example":"import tkinter as tk\nroot = tk.Tk()\ntk.Label(root, text=\"你好\").pack()","trap":"变量对象 StringVar、IntVar 常与输入类控件配合。","keywords":["tkinter","Label","Button","Entry","Text"]},{"id":"gui.02","title":"窗体设计与控件布局","requirement":"理解","points":["Tk() 创建根窗口，mainloop() 进入事件循环。","pack() 按顺序排布，side 和 fill 控制方向与填充。","grid(row, column) 按行列排布，适合表单。","place(x, y) 按坐标定位；同一父容器中混用布局要谨慎。"],"example":"tk.Button(root, text=\"确定\").grid(row=0, column=0)","trap":"布局管理器的作用对象是父容器，跨容器布局容易出错。","keywords":["Tk","mainloop","pack","grid","place"]},{"id":"gui.03","title":"事件响应与函数绑定","requirement":"理解","points":["Button 的 command 绑定点击回调函数。","bind(event, handler) 可绑定键盘、鼠标、窗口事件。","事件处理函数可接收 event 参数，读取 widget、x、y、keysym 等信息。","回调函数应传入函数对象，不要写成立即调用的结果。"],"example":"def hello():\n    print(\"点击\")\n\nbtn = tk.Button(root, text=\"点我\", command=hello)","trap":"command=hello() 会立刻执行，正确写法是 command=hello。","keywords":["command","bind","事件循环","回调"]},{"id":"viz.01","title":"tkinter Canvas、turtle 与 matplotlib 绘图","requirement":"理解","points":["Canvas 提供 create_line、create_rectangle、create_oval、create_text 等绘图方法。","turtle 通过 forward、backward、right、left、circle 等命令绘图。","matplotlib 适合函数图、柱状图、折线图、散点图、饼图。","绘图前要准备数据，绘图后可用 show() 显示或 savefig() 保存。"],"example":"plt.bar([\"A\", \"B\"], [3, 5])\nplt.show()","trap":"Canvas 的 y 轴向下，matplotlib 的 y 轴向上，坐标方向不同。","keywords":["Canvas","turtle","matplotlib"]},{"id":"viz.02","title":"绘图区域、坐标、函数图形与数据可视化","requirement":"理解","points":["绘图区域由坐标轴和数据范围决定，可设置 xlim、ylim、xlabel、ylabel、title。","函数图形通常先生成 x 序列，再计算 y = f(x)，最后 plot。","数据可视化要根据数据类型选择图形：趋势用折线、比较用柱状、占比用饼图、关系用散点。","中文标签需要设置可用字体，否则可能显示方块。"],"example":"x = [i / 10 for i in range(-50, 51)]\ny = [v * v for v in x]\nplt.plot(x, y)","trap":"图形显示不出来时检查数据范围、坐标轴、show 和绘图库导入。","keywords":["xlim","ylim","函数图","数据可视化"]}]}];
const EXAM_DATE = new Date('2026-11-28T09:00:00+08:00');
const STORAGE_KEY = 'pypass-shanghai-python-v1';
const chapterMap = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
const syllabusMap = Object.fromEntries(SYLLABUS.map(c => [c.chapter, c]));
const allUnits = SYLLABUS.flatMap(c => c.units.map(u => ({...u, chapter:c.chapter, chapterName:c.name})));
const questionMap = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const levelText = {'23':'二三级', '3':'三级强化'};
const typeText = {choice:'单选题', fill:'程序填空', self:'编程自评'};
const diffText = {1:'基础', 2:'常考', 3:'进阶'};
const APP_VERSION = '2026.10.16.2';

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function defaultState() {
  return {
    records: {}, favorites: [], notes: {}, unitNotes: {}, freeNotes: [], disputes: {}, read: {}, activity: {},
    goals: { daily: 20, auto: true }, settings: { immediate: true },
    ai: { provider:'local', baseUrl:'', apiKey:'', model:'', temperature:0.3 }, aiHistory: [],
    createdAt: new Date().toISOString()
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const saved = JSON.parse(raw);
    return {...defaultState(), ...saved, records: saved.records || {}, goals: {...defaultState().goals, ...(saved.goals || {})}, settings: {...defaultState().settings, ...(saved.settings || {})}, ai: {...defaultState().ai, ...(saved.ai || {})}, aiHistory: saved.aiHistory || []};
  } catch (e) { return defaultState(); }
}
let state = loadState();
let ui = {
  view: 'dashboard', practiceSetup: { chapter: 'all', level: 'all', count: 20, type: 'all', search: '' },
  session: null, wrongSearch: '', favSearch: '', notebookSearch: '', kbOpen: '', toastTimer: null,
  quickNoteOpen:false, quickNoteTitle:'', quickNoteBody:'', quickNoteSource:'', questionNoteOpenId:'',
  knowledgeSearch:'', knowledgeChapter:'all', knowledgeReq:'all', aiBusy:false, aiInput:'', aiContext:null, viewScroll:{}, chatScroll:0
};

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function normAnswer(v) {
  return String(v ?? '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[；;]/g, ';').replace(/[，,]/g, ',');
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sum(arr) { return arr.reduce((a, b) => a + b, 0); }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
function daysUntilExam() {
  const now = new Date();
  return Math.max(0, Math.floor((EXAM_DATE - now) / 86400000));
}
function planDaysLeft() { return Math.max(1, daysUntilExam()); }
function suggestedDailyCount() {
  const days=planDaysLeft(); const active=QUESTIONS.filter(q=>!isMastered(q.id));
  const unseen=active.filter(q=>getRecord(q.id).attempts===0).length; const wrong=getWrongIds().length;
  const raw=Math.ceil((unseen+wrong*1.5)/days);
  if(days>30) return Math.min(30,Math.max(20,raw));
  if(days>14) return Math.min(40,Math.max(25,raw));
  if(days>7) return Math.min(50,Math.max(30,raw));
  return Math.min(60,Math.max(25,raw));
}
function autoUpdateDailyGoal() { if(state.goals.auto){ const target=suggestedDailyCount(); if(state.goals.daily!==target){state.goals.daily=target; saveState();} } }
function dailyPlanData() {
  const key=todayKey(); const a=state.activity[key]||{answered:0,correct:0,wrongReview:0,programming:0};
  const days=planDaysLeft(); const target=suggestedDailyCount();
  const wrong=getWrongIds().length; const reviewTarget=Math.min(wrong,Math.max(5,Math.ceil(target*0.35)));
  const programmingTarget=days<=20?1:0;
  return {key,days,target,done:a.answered||0,correct:a.correct||0,wrongReview:a.wrongReview||0,reviewTarget,programming:a.programming||0,programmingTarget,wrong};
}
function getRecord(id) {
  return state.records[id] || {attempts:0, correct:0, wrong:0, correctStreak:0, lastResult:null, lastAt:null, history:[]};
}
function ensureRecord(id) { if (!state.records[id]) state.records[id] = getRecord(id); return state.records[id]; }
function recordResult(id, correct) {
  const r = ensureRecord(id);
  r._lastImpact={correct,key:todayKey(),mode:ui.session?.mode||'',programming:questionMap[id]?.type==='self'};
  r.attempts += 1;
  if (correct) { r.correct += 1; r.correctStreak += 1; } else { r.wrong += 1; r.correctStreak = 0; }
  r.lastResult = correct ? 'correct' : 'wrong';
  r.lastAt = new Date().toISOString();
  r.history = [...(r.history || []).slice(-19), {at:r.lastAt, correct}];
  const key = todayKey();
  state.activity[key] = state.activity[key] || {answered:0, correct:0, wrongReview:0, programming:0};
  state.activity[key].answered += 1;
  if (correct) state.activity[key].correct += 1;
  if((ui.session?.mode)==='wrong') state.activity[key].wrongReview += 1;
  const q=questionMap[id];
  if(q?.type==='self') state.activity[key].programming += 1;
  saveState(); updateNav();
}
function isMastered(id) { const r=getRecord(id); return !!r.mastered || r.correctStreak >= 2; }
function getWrongIds() {
  return QUESTIONS.filter(q => { const r = getRecord(q.id); return !r.mastered && r.wrong > 0 && r.correctStreak < 2; }).map(q => q.id);
}
function getFavoriteIds() { return state.favorites.filter(id => questionMap[id]); }
function getStats() {
  const records = Object.entries(state.records);
  const attempts = sum(records.map(([,r]) => r.attempts || 0));
  const correct = sum(records.map(([,r]) => r.correct || 0));
  const seen = records.filter(([,r]) => (r.attempts || 0) > 0).length;
  const today = state.activity[todayKey()] || {answered:0, correct:0};
  return {attempts, correct, seen, accuracy:pct(correct, attempts), today, wrong:getWrongIds().length, mastered:QUESTIONS.filter(q => isMastered(q.id)).length};
}
function chapterStat(chapterId) {
  const qs = QUESTIONS.filter(q => q.chapter === chapterId);
  const records = qs.map(q => getRecord(q.id));
  const attempts = sum(records.map(r => r.attempts || 0));
  const correct = sum(records.map(r => r.correct || 0));
  const seen = records.filter(r => (r.attempts || 0) > 0).length;
  return {total:qs.length, attempts, correct, seen, accuracy:pct(correct, attempts), coverage:pct(seen, qs.length), wrong:qs.filter(q => {const r=getRecord(q.id); return r.wrong>0 && r.correctStreak<2;}).length};
}

<script>
function unitMatches(unit) {
  const q = ui.knowledgeSearch.trim().toLowerCase();

  const chOK = ui.knowledgeChapter === 'all' || unit.chapter === ui.knowledgeChapter;

  if (!q) return true;
  const text = [unit.title, unit.requirement, unit.chapterName, unit.example, unit.trap, ...(unit.points||[]), ...(unit.keywords||[])].join(' ').toLowerCase();
  return text.includes(q);
}
function questionProgressChip(q) {
  const r=getRecord(q.id); const hasNote=!!String(state.notes?.[q.id]||'').trim();
  let label='未做', cls='todo';
  if(isMastered(q.id)){label='已掌握';cls='mastered';}
  else if(r.wrong>0&&r.correctStreak<2){label='错题';cls='wrong';}
  else if(r.review){label='待复习';cls='review';}
  else if(r.attempts>0){label='做过';cls='done';}
  const noteText=hasNote?`｜笔记：${state.notes[q.id]}`:'｜暂无笔记';
  return `<button class="q-progress ${cls} ${hasNote?'has-note':''}" data-action="single-question" data-id="${q.id}" title="点击做这题${esc(noteText)}">${q.id} ${label}${hasNote?' ✎':''}</button>`;

<script>
function filterBank(opts = {}) {
  const includeMastered = !!opts.includeMastered;
  const chapter = opts.chapter || 'all', level = opts.level || 'all', type = opts.type || 'all', search = (opts.search || '').trim().toLowerCase();
  return QUESTIONS.filter(q => {
    if (!includeMastered && isMastered(q.id)) return false;
    if (chapter !== 'all' && q.chapter !== chapter) return false;
    if (level !== 'all' && q.level !== level && !(level === '23' && q.level === '23')) return false;
    if (type !== 'all' && q.type !== type) return false;
    if (search) {
      const text = [q.id,q.question,q.code,q.topic,chapterMap[q.chapter]?.name,...(q.tags||[])].join(' ').toLowerCase();
      if (!text.includes(search)) return false;
    }
    return true;
  });
}
function smartQueue(limit = 20) {
  const wrong = getWrongIds().map(id => questionMap[id]);
  const active = QUESTIONS.filter(q => !isMastered(q.id));
  const unseen = active.filter(q => getRecord(q.id).attempts === 0);
  const weakChapters = CHAPTERS.map(c => ({id:c.id, ...chapterStat(c.id)})).sort((a,b) => (a.accuracy || 101) - (b.accuracy || 101));
  const weak = [];
  weakChapters.forEach(c => weak.push(...active.filter(q => q.chapter === c.id)));
  const pool = [...wrong, ...unseen, ...weak, ...shuffle(active)];
  return [...new Map(pool.map(q => [q.id,q])).values()].slice(0, limit).map(q => q.id);
}
function renderPracticeHome() {
  const f = ui.practiceSetup;
  const filtered = filterBank(f);
  const chapterCounts = Object.fromEntries(CHAPTERS.map(c => [c.id, chapterStat(c.id).total]));
  const activePool=QUESTIONS.filter(q=>!isMastered(q.id));
  const typeCounts = {all:activePool.length, choice:activePool.filter(q=>q.type==='choice').length, fill:activePool.filter(q=>q.type==='fill').length, self:activePool.filter(q=>q.type==='self').length};
  return `
  <section class="grid cols-3">
    <article class="card mode-card" data-action="start-smart"><div class="corner"></div><div class="num">智能</div><b>薄弱优先 20 题</b><p>先错题、未做题，再补低正确率章节</p></article>
    <article class="card mode-card" data-action="start-sprint"><div class="corner" style="background:var(--amber-l)"></div><div class="num" style="color:#a56b00">30:00</div><b>限时冲刺 30 题</b><p>30 分钟倒计时，训练做题节奏</p></article>
    <article class="card mode-card" data-action="start-daily"><div class="corner" style="background:var(--green-l)"></div><div class="num" style="color:var(--green)">${state.goals.daily}</div><b>今日目标</b><p>补足今天的计划题量</p></article>
  </section>

  <section class="card" style="margin-top:16px">
    <div class="section-head" style="margin:0 0 15px"><div><h2>自选题组</h2><p>当前条件可选 ${filtered.length} 题</p></div><span class="badge blue">立即判题</span></div>
    <div class="filter-bar">
      <div class="field"><label>搜索题目 / 知识点</label><input id="practiceSearch" data-filter="search" value="${esc(f.search)}" placeholder="例如：切片、sqlite、递归"></div>
      <div class="field"><label>知识模块</label><select data-filter="chapter"><option value="all">全部模块</option>${CHAPTERS.map(c=>`<option value="${c.id}" ${f.chapter===c.id?'selected':''}>${c.icon} ${esc(c.name)}（${chapterCounts[c.id]}）</option>`).join('')}</select></div>
      <div class="field"><label>等级</label><select data-filter="level"><option value="all" ${f.level==='all'?'selected':''}>二三级全部</option><option value="23" ${f.level==='23'?'selected':''}>二三级基础</option><option value="3" ${f.level==='3'?'selected':''}>三级强化</option></select></div>
      <div class="field"><label>题型</label><select data-filter="type"><option value="all" ${f.type==='all'?'selected':''}>全部题型（${typeCounts.all}）</option><option value="choice" ${f.type==='choice'?'selected':''}>单选题（${typeCounts.choice}）</option><option value="fill" ${f.type==='fill'?'selected':''}>程序填空（${typeCounts.fill}）</option><option value="self" ${f.type==='self'?'selected':''}>编程自评（${typeCounts.self}）</option></select></div>
    </div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:15px">
      ${[10,20,30,50].map(n=>`<button class="pill ${f.count===n?'active':''}" data-action="set-count" data-count="${n}">${n} 题</button>`).join('')}
      <button class="btn primary" data-action="start-filtered" ${filtered.length?'':'disabled'} style="margin-left:auto">按条件开始</button>

    </div>
    ${filtered.length===0?`<div class="callout" style="margin-top:15px">没有符合当前条件的题目，请放宽筛选。</div>`:''}
  </section>

  <div class="section-head"><div><h2>按章节刷</h2><p>适合配合知识清单逐章突破</p></div></div>
  <section class="grid cols-2">
    ${CHAPTERS.map(c => {const st=chapterStat(c.id);return `<div class="card" style="display:flex;align-items:center;gap:13px">
      <div class="kb-no">${c.icon}</div>
      <div style="flex:1;min-width:0"><b>${esc(c.name)}</b><div class="small muted">${st.total} 题 · 覆盖 ${st.coverage}% · 正确率 ${st.accuracy}% ${st.wrong?`· 待清 ${st.wrong}`:''}</div><div class="progress" style="margin-top:7px"><i style="width:${st.coverage}%"></i></div></div>
      <button class="btn small primary" data-action="chapter-practice" data-chapter="${c.id}">练习</button>
    </div>`}).join('')}
  </section>`;
}
</script>

  const maxAnswers = Math.max(1, ...last14.map(x => state.activity[x.key]?.answered || 0));

    <div class="card"><h3>提分顺序</h3><p class="muted">先拿下单选和填空，再练调试改错，最后用编程题模板覆盖文件、正则、SQLite、JSON 与可视化。</p></div>
  </section>
  <section class="card" style="margin-top:16px"><h2>考前检查</h2><div class="grid cols-2"><div><div class="kb-section"><h4>证件与信息</h4><ul><li>准考证下载、考试校区、场次和入场时间</li><li>身份证件与学校要求的其他材料</li><li>提前确认交通路线，至少提前 30 分钟到校</li></ul></div><div class="kb-section"><h4>代码手感</h4><ul><li>文件读写与字符串清洗</li><li>列表/字典统计、排序与列表解析式</li><li>函数参数、递归和常见内置函数</li></ul></div></div><div><div class="kb-section"><h4>三级高频模板</h4><ul><li><code>re.findall / re.sub</code> 提取和替换</li><li><code>sqlite3</code> 连接、游标、查询、关闭</li><li><code>json.loads / json.dumps</code></li><li><code>matplotlib.pyplot</code> 绘图基本骨架</li></ul></div><div class="kb-section"><h4>最后一天</h4><ul><li>不复盘超长代码，只回看错因</li><li>保证睡眠，不临时改变作息</li><li>上机时先读输入输出要求，再写核心逻辑</li></ul></div></div></div></section>`;
}
</script>
<script>
function startSession(ids, title = '练习', mode = 'practice', timeLimit = 0, meta = {}) {
  const clean = [...new Set(ids)].filter(id => questionMap[id]);
  if (!clean.length) { showToast('暂无可练习的题目'); return; }
  if (ui.session?.timer) clearInterval(ui.session.timer);
  ui.session = {
    ids: clean, idx: 0, title, mode, meta: meta || {}, startedAt: Date.now(), elapsed: 0, timeLimit,
    answered: false, result: null, selected: null, answerText: '', selfRevealed: false,
    results: {}, questionState: {}, timer: null, finished: false
  };
  ui.view = 'practice';
  if (timeLimit) {
    ui.session.timer = setInterval(() => {
      if (!ui.session || ui.session.finished) return;
      ui.session.elapsed = Math.floor((Date.now() - ui.session.startedAt) / 1000);
      const left = ui.session.timeLimit - ui.session.elapsed;
      const el = document.getElementById('qTimer');
      if (el) el.textContent = `剩余 ${fmtTime(left)}`;
      if (left <= 0) finishSession(true);
    }, 1000);
  }
  render();
}

function stopSessionTimer() { if (ui.session?.timer) clearInterval(ui.session.timer); }
function sessionQuestion() { return ui.session ? questionMap[ui.session.ids[ui.session.idx]] : null; }
function saveCurrentQuestionState() {
  if(!ui.session) return; const q=sessionQuestion(); if(!q) return;
  ui.session.questionState[q.id]={answered:ui.session.answered,result:ui.session.result,selected:ui.session.selected,answerText:ui.session.answerText,selfRevealed:ui.session.selfRevealed};
}
function loadQuestionState(id) {
  const st=ui.session?.questionState?.[id];
  ui.session.answered=!!st?.answered; ui.session.result=st?.result||null; ui.session.selected=st?.selected||null; ui.session.answerText=st?.answerText||''; ui.session.selfRevealed=!!st?.selfRevealed;
}
function sessionResult(correct) {
  const q = sessionQuestion();
  if (!q || ui.session.answered) return;
  ui.session.answered = true;
  ui.session.result = correct ? 'correct' : 'wrong';
  ui.session.results[q.id] = ui.session.result;
  recordResult(q.id, correct);
  saveCurrentQuestionState();
  render();
}
function chooseOption(letter) {
  const q = sessionQuestion();
  if (!q || q.type !== 'choice' || ui.session.answered) return;
  ui.session.selected = letter;
  sessionResult(letter === q.answer);
}
function submitFill() {
  const q = sessionQuestion();
  if (!q || q.type !== 'fill' || ui.session.answered) return;
  const input = document.getElementById('fillAnswer');
  const value = input ? input.value : '';
  if (!value.trim()) { showToast('先填写答案'); return; }
  ui.session.answerText = value;
  const ok = (q.answer || []).some(a => normAnswer(a) === normAnswer(value));
  sessionResult(ok);
}
function revealCurrent() {
  const q = sessionQuestion();
  if (!q || ui.session.answered) return;
  ui.session.answered = true; ui.session.result = 'wrong'; ui.session.results[q.id] = 'wrong';
  recordResult(q.id, false); render();
}
function selfJudge(correct) {
  const q = sessionQuestion();
  if (!q || q.type !== 'self' || ui.session.answered) return;
  sessionResult(!!correct);
}
function nextQuestion() {
  if (!ui.session || !ui.session.answered) { showToast('先提交本题答案'); return; }
  saveCurrentQuestionState();
  if (ui.session.idx >= ui.session.ids.length - 1) { finishSession(false); return; }
  ui.session.idx += 1;
  loadQuestionState(ui.session.ids[ui.session.idx]);
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function prevQuestion() {
  if (!ui.session || ui.session.idx <= 0) { showToast('已经是第一题'); return; }
  saveCurrentQuestionState();
  ui.session.idx -= 1;
  loadQuestionState(ui.session.ids[ui.session.idx]);
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
function finishSession(timedOut = false) {
  if (!ui.session) return;
  stopSessionTimer(); ui.session.finished = true;
  ui.session.elapsed = Math.floor((Date.now() - ui.session.startedAt) / 1000);
  if (timedOut) showToast('时间到，已自动交卷');
  render();
}

function renderQuestionNote(q) {
  const note=String(state.notes?.[q.id]||'');
  const open=ui.questionNoteOpenId===q.id;
  return `<div class="question-note-box"><div class="question-note-head"><div><b>这道题的笔记</b><span>${note?'已记录，下次做到 ${q.id} 会自动显示':'绑定到题号 ${q.id}，不会和别的题混在一起'}</span></div><button class="btn small" data-action="toggle-question-note" data-id="${q.id}">${open?'收起':(note?'编辑笔记':'写笔记')}</button></div>${!open&&note?`<div class="question-note-preview">${esc(note)}</div>`:''}${open?`<textarea data-question-note="${q.id}" placeholder="写这道题的错因、关键步骤、易混点……">${esc(note)}</textarea><div class="fb-actions"><button class="btn primary small" data-action="save-question-note" data-id="${q.id}">保存本题笔记</button>${note?`<button class="btn small ghost" data-action="clear-question-note" data-id="${q.id}">删除</button>`:''}</div>`:''}</div>`;
}
function saveQuestionNote(id) {
  const box=document.querySelector(`[data-question-note="${id}"]`); if(!box) return;
  const text=box.value.trim(); state.notes=state.notes||{};
  if(text) state.notes[id]=text; else delete state.notes[id];
  ui.questionNoteOpenId=''; saveState(); render(); showToast(text?'本题笔记已保存':'本题笔记已清空');
}
function openQuestionNote(id) { ui.questionNoteOpenId=id; startSession([id],`题目笔记 · ${id}`,'note'); ui.questionNoteOpenId=id; render(); }
function renderPractice() {
  if (!ui.session) return '';
  if (ui.session.finished) return renderSessionSummary();
  const q = sessionQuestion();
  if (!q) return '';
  const ch = chapterMap[q.chapter], fav = state.favorites.includes(q.id);
  const progress = pct(ui.session.idx + (ui.session.answered ? 1 : 0), ui.session.ids.length);
  let answerArea = '';
  if (q.type === 'choice') {
    answerArea = `<div class="options">${q.options.map((opt,i) => {
      const letter = 'ABCD'[i]; let cls = '';
      if (ui.session.answered) {
        if (letter === q.answer) cls = 'correct';
        else if (letter === ui.session.selected) cls = 'wrong';
        else cls = 'dim';
      }
      return `<button class="option ${cls}" data-action="choose-option" data-letter="${letter}" ${ui.session.answered?'disabled':''}><span class="letter">${letter}</span><span>${esc(opt)}</span></button>`;
    }).join('')}</div>`;
  } else if (q.type === 'fill') {
    answerArea = `<div class="answer-box"><input id="fillAnswer" value="${esc(ui.session.answerText)}" ${ui.session.answered?'disabled':''} placeholder="输入代码片段后提交"><button class="btn primary" data-action="submit-fill" ${ui.session.answered?'disabled':''}>提交答案</button></div>`;
  } else {
    answerArea = `<div class="feedback" style="margin-top:18px"><div class="feedback-head">编程题自评</div><p class="muted">先独立在草稿或本机编辑器中完成，再查看参考实现并如实自评。自评结果同样会影响错题本和统计。</p><div class="fb-actions">${ui.session.selfRevealed?'':`<button class="btn primary" data-action="reveal-self">查看参考实现</button>`}</div></div>`;
  }
  return `<div class="practice-wrap">
    <div class="practice-head">
      <div class="left"><button class="btn small" data-action="exit-session">退出</button><div><div class="q-counter">第 ${ui.session.idx+1} / ${ui.session.ids.length} 题</div><div class="tiny muted">${esc(ui.session.title)} · ${ui.session.mode==='sprint'?'限时模式':'练习模式'}</div></div></div>
      <div class="q-timer" id="qTimer">${ui.session.timeLimit?`剩余 ${fmtTime(ui.session.timeLimit-ui.session.elapsed)}`:`已用时 ${fmtTime(ui.session.elapsed)}`}</div>
    </div>
    <div class="progress" style="margin-bottom:14px"><i style="width:${progress}%"></i></div>
    <section class="card question-card">
      <div class="qmeta"><span class="badge blue">${ch?.icon} ${esc(ch?.name||'')}</span><span class="badge">${typeText[q.type]}</span><span class="badge ${q.difficulty===3?'amber':''}">${diffText[q.difficulty]}</span><span class="badge">${levelText[q.level]}</span>${q.topic?`<span class="badge">${esc(q.topic)}</span>`:''}<span class="badge">${q.id}</span></div>
      <h2 class="qtext">${esc(q.question)}</h2>
      ${q.code?`<pre><code>${esc(q.code)}</code></pre>`:''}
      ${renderQuestionNote(q)}
      ${answerArea}
      ${ui.session.answered && q.type!=='self' ? renderFeedback(q) : ''}
      ${ui.session.selfRevealed ? renderSelfReference(q) : ''}
      <div class="practice-bottom">
        <div class="session-dots" title="答题进度">${ui.session.ids.map((id,i)=>{const r=ui.session.results[id];return `<i class="${i===ui.session.idx?'now':r==='correct'?'ok':r==='wrong'?'no':''}"></i>`}).join('')}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-action="prev-q" ${ui.session.idx===0?'disabled':''}>上一题</button><button class="btn small" data-action="ask-ai-current">AI 讲这题</button><button class="btn small" data-action="toggle-fav-current">${fav?'★ 已收藏':'☆ 收藏'}</button>${!ui.session.answered&&q.type!=='self'?`<button class="btn small ghost" data-action="reveal-current">查看答案</button>`:''}<button class="btn primary" data-action="next-q" ${ui.session.answered?'':'disabled'}>${ui.session.idx===ui.session.ids.length-1?'完成本组':'下一题'}</button></div>
      </div>
    </section>
  </div>`;
}
</script>
<script>
function restoreMastered(id) {
  const r=ensureRecord(id); r.mastered=false; r.correctStreak=0; r.review=true;
  saveState(); render(); showToast('已重新加入复习');
}
function undoLastResult(id) {
  const r=ensureRecord(id); const hist=[...(r.history||[])]; if(!hist.length) return;
  const last=hist.pop(); r.history=hist;
  r.attempts=Math.max(0,(r.attempts||0)-1);
  if(last.correct) r.correct=Math.max(0,(r.correct||0)-1); else r.wrong=Math.max(0,(r.wrong||0)-1);
  let streak=0; for(let i=hist.length-1;i>=0&&hist[i].correct;i--) streak++; r.correctStreak=streak;
  r.lastResult=hist.length?(hist[hist.length-1].correct?'correct':'wrong'):null; r.lastAt=hist.length?hist[hist.length-1].at:null;
  const imp=r._lastImpact; if(imp){ const a=state.activity[imp.key]; if(a){ a.answered=Math.max(0,(a.answered||0)-1); if(imp.correct)a.correct=Math.max(0,(a.correct||0)-1); if(imp.mode==='wrong')a.wrongReview=Math.max(0,(a.wrongReview||0)-1); if(imp.programming)a.programming=Math.max(0,(a.programming||0)-1); } delete r._lastImpact; }
  saveState();
}
function retryCurrentQuestion() {
  const q=sessionQuestion(); if(!q||!ui.session?.answered) return;
  undoLastResult(q.id); delete ui.session.results[q.id]; delete ui.session.questionState[q.id];
  ui.session.answered=false; ui.session.result=null; ui.session.selected=null; ui.session.answerText=''; ui.session.selfRevealed=false;
  render(); showToast('已撤销本题成绩，可以重新选择答案');
}
function buildQuestionReport(q,note='') {
  const options=q.type==='choice'?q.options.map((x,i)=>`${'ABCD'[i]}. ${x}`).join('\n'):'';
  const answer=q.type==='self'?'编程题':(Array.isArray(q.answer)?q.answer.join(' / '):q.answer);
  return `题目编号：${q.id}\n章节：${chapterMap[q.chapter]?.name||''}\n题型：${typeText[q.type]||q.type}\n\n题干：${q.question}\n${q.code?`\n代码：\n${q.code}\n`:''}${options?`\n选项：\n${options}\n`:''}\n题库标注答案：${answer}\n解析：${q.explanation}\n\n我的说明：${note||'（请填写你认为哪里错了）'}`;
}
function openQuestionReport() {
  const q=sessionQuestion(); if(!q) return; const old=state.disputes?.[q.id]?.note||'';
  const body=`<div class="callout"><b>${q.id}</b><br>${esc(q.question)}</div><div class="field" style="margin-top:12px"><label>你认为哪里有问题？</label><textarea id="disputeNote" style="min-height:130px" placeholder="例如：正确答案应是 B；解析中的输出写错了；选项重复……">${esc(old)}</textarea></div><div class="small muted" style="margin-top:8px">保存后会记录在当前浏览器；点“提交到 GitHub”会打开一个已填好题目内容的 Issue 页面。</div>`;
  openModal('题目纠错',body,`<button class="btn primary" data-action="submit-question-report">提交到 GitHub</button><button class="btn" data-action="copy-question-report">复制报错内容</button><button class="btn" data-action="close-modal">取消</button>`);
}
function saveQuestionDispute() { const q=sessionQuestion(); if(!q) return ''; const note=document.getElementById('disputeNote')?.value.trim()||''; state.disputes=state.disputes||{}; state.disputes[q.id]={note,at:new Date().toISOString()}; saveState(); return note; }
function copyQuestionReport() { const q=sessionQuestion(); if(!q) return; const note=saveQuestionDispute(); const text=buildQuestionReport(q,note); const done=()=>{closeModal();render();showToast('报错内容已复制');}; if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); else fallbackCopy(text,done); }
function fallbackCopy(text,after) { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); if(after)after(); }
function submitQuestionReport() { const q=sessionQuestion(); if(!q) return; const note=saveQuestionDispute(); const title=`[题目纠错] ${q.id} ${q.question.slice(0,40)}`; const url=`https://github.com/yeziqiu1/pypass-shanghai-python-quiz/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(buildQuestionReport(q,note))}`; closeModal(); render(); window.open(url,'_blank','noopener'); showToast('已打开 GitHub 报错页面'); }
function markCurrentMastered() {
  const q=sessionQuestion(); if(!q) return;
  const r=ensureRecord(q.id); r.mastered=true; r.correctStreak=2; r.wrong=0; r.review=false; r.lastResult='correct'; r.lastAt=new Date().toISOString();
  saveState(); render(); showToast('已掌握，后续普通练习不再出现');
}
function markCurrentReview() {
  const q=sessionQuestion(); if(!q) return;
  const r=ensureRecord(q.id); r.mastered=false; r.correctStreak=0; r.review=true;
  saveState(); render(); showToast('已加入待复习，后续练习会再次出现');
}
function renderMasteryControls(q) {
  const r=getRecord(q.id);
  if(r.mastered) return `<div class="mastery-box mastered"><div><b>✓ 已标记掌握</b><span>之后普通练习会跳过这道题</span></div><button class="btn small ghost" data-action="mark-current-review">重新加入复习</button></div>`;
  return `<div class="mastery-box"><div><b>这道题掌握了吗？</b><span>选择“已掌握”后，普通练习不再出现</span></div><div class="fb-actions"><button class="btn primary small" data-action="mark-current-mastered">已掌握，不再出现</button><button class="btn small" data-action="mark-current-review">还不熟练，下次再来</button></div></div>`;
}
function renderFeedback(q) {
  const good = ui.session.result === 'correct';
  const answer = q.type === 'choice' ? q.answer : (q.answer || []).join(' / ');
  const disputed=!!state.disputes?.[q.id];
  return `<div class="feedback ${good?'good':'bad'}"><div class="feedback-head"><span>${good?'✓ 回答正确':'× 需要复盘'}</span><span class="badge ${good?'green':'red'}">${q.id}</span></div><div><b>正确答案：</b><code>${esc(answer)}</code></div><p><b>解析：</b>${esc(q.explanation)}</p><div class="ai-explain-row"><button class="btn primary small" data-action="ask-ai-current">AI 自动讲解本题</button><span>不用复制，系统会带上完整题干和答案</span></div>${renderMasteryControls(q)}<div class="fb-actions" style="margin-top:10px"><button class="btn small" data-action="retry-current">修改本题答案</button><button class="btn small ${disputed?'amber':''}" data-action="report-question">${disputed?'已报错':'题目报错'}</button></div></div>`;
}

function renderSelfReference(q) {
  return `<div class="feedback good" style="margin-top:16px"><div class="feedback-head">参考实现</div><pre style="margin-top:8px"><code>${esc(q.modelAnswer)}</code></pre><p><b>思路：</b>${esc(q.explanation)}</p>${ui.session.answered?`<div class="ai-explain-row"><button class="btn primary small" data-action="ask-ai-current">AI 自动讲解本题</button><span>题干、代码和参考实现会自动带入</span></div>`+renderMasteryControls(q)+`<div class="fb-actions" style="margin-top:10px"><button class="btn small" data-action="retry-current">修改本题答案</button><button class="btn small" data-action="report-question">题目报错</button></div>`:`<div class="fb-actions"><button class="btn primary small" data-action="self-correct">我写对了</button><button class="btn small danger" data-action="self-wrong">需要复盘</button></div>`}</div>`;
}

function nextUnitInfo() {
  const unitId=ui.session?.meta?.unitId; if(!unitId) return null;
  const idx=allUnits.findIndex(u=>u.id===unitId); if(idx<0) return null;
  return {current:allUnits[idx],next:allUnits[idx+1]||null,index:idx,total:allUnits.length};
}
function practiceNextUnit() { const info=nextUnitInfo(); if(!info?.next){showToast('已经是最后一个知识点');return;} practiceUnit(info.next.id); }
function nextChapterInfo() { const ch=ui.session?.meta?.chapter; if(!ch) return null; const idx=CHAPTERS.findIndex(c=>c.id===ch); return idx<0?null:{next:CHAPTERS[idx+1]||null,index:idx,total:CHAPTERS.length}; }
function practiceNextChapter() { const info=nextChapterInfo(); if(!info?.next){showToast('已经是最后一个章节');return;} handleAction('chapter-practice',{dataset:{chapter:info.next.id}}); }
function renderSessionSummary() {
  const total = ui.session.ids.length;
  const correct = Object.values(ui.session.results).filter(x=>x==='correct').length;
  const wrongIds = Object.entries(ui.session.results).filter(([,r])=>r==='wrong').map(([id])=>id);
  const untouched = ui.session.ids.filter(id => !ui.session.results[id]);
  const nextUnit=nextUnitInfo(); const nextChapter=nextChapterInfo();
  return `<div class="practice-wrap"><section class="card" style="text-align:center;padding:34px 24px">
    <div class="kicker">本组完成</div><h1 style="font-size:40px;margin:8px 0">${correct} / ${total}</h1><p class="muted">正确率 ${pct(correct,total)}% · 用时 ${fmtTime(ui.session.elapsed)}</p>
    <div class="progress" style="max-width:520px;margin:18px auto"><i style="width:${pct(correct,total)}%;background:linear-gradient(90deg,var(--green),#45b391)"></i></div>
    ${nextUnit?`<div class="next-unit-box"><div><div class="tiny muted">${nextUnit.next?'下一个知识点':'已到最后一个知识点'}</div><b>${esc(nextUnit.next?nextUnit.next.title:'本大纲知识点已全部走完')}</b></div>${nextUnit.next?`<button class="btn primary" data-action="next-unit-practice">继续下一个知识点</button>`:`<button class="btn" data-action="go-knowledge">返回知识清单</button>`}</div>`:''}
    ${!nextUnit&&nextChapter?`<div class="next-unit-box"><div><div class="tiny muted">${nextChapter.next?'下一章':'已到最后一章'}</div><b>${esc(nextChapter.next?nextChapter.next.name:'章节已全部完成')}</b></div>${nextChapter.next?`<button class="btn primary" data-action="next-chapter-practice">继续下一章</button>`:''}</div>`:''}
    <div class="fb-actions" style="justify-content:center"><button class="btn primary" data-action="retry-wrong" ${wrongIds.length?'':'disabled'}>重练错题 ${wrongIds.length}</button><button class="btn" data-action="retry-session">重新做本组</button><button class="btn" data-action="finish-home">返回总览</button></div>
    ${untouched.length?`<p class="small muted" style="margin-top:18px">未作答 ${untouched.length} 题（限时结束），已不计入错题。</p>`:''}
  </section></div>`;
}
</script>
<script>
function queueFromFilter(shuffleMode = false) {
  const f = ui.practiceSetup;
  const list = filterBank(f);
  const chosen = (shuffleMode ? shuffle(list) : list).slice(0, Math.max(1, Number(f.count) || 20));
  return chosen.map(q => q.id);
}
function startQuickRandom() { const pool=QUESTIONS.filter(q=>!isMastered(q.id)); if(!pool.length){showToast('所有题都已掌握，可去统计中取消掌握');return;} startSession(shuffle(pool).slice(0,10).map(q=>q.id),'随机热身 10 题','random'); }
function startSprint() { const pool=QUESTIONS.filter(q=>!isMastered(q.id)); if(!pool.length){showToast('所有题都已掌握，可去统计中取消掌握');return;} startSession(shuffle(pool).slice(0,30).map(q=>q.id),'限时冲刺 30 题','sprint',30*60); }
function startWrongSession(randomize = false) {
  let ids = getWrongIds(); if (randomize) ids = shuffle(ids).slice(0,10);
  if (!ids.length) { showToast('当前没有待清错题'); return; }
  startSession(ids, randomize?'错题随机 10 题':'错题回炉','wrong');
}
function startFavorites() {
  const ids = getFavoriteIds();
  if (!ids.length) { showToast('还没有收藏题'); return; }
  startSession(shuffle(ids),'收藏题练习','favorite');
}
function startDaily() {
  const remain = Math.max(1, state.goals.daily - (getStats().today.answered || 0));
  startSession(smartQueue(remain),`今日目标 · ${remain} 题`,'daily');
}
function toggleFavorite(id) {
  const i = state.favorites.indexOf(id);
  if (i >= 0) state.favorites.splice(i,1); else state.favorites.push(id);
  saveState(); render(); showToast(i>=0?'已取消收藏':'已加入收藏');
}
function markMastered(id) {
  const r = ensureRecord(id); r.wrong = 0; r.correctStreak = 2; r.mastered = true; r.lastResult = 'correct'; r.lastAt = new Date().toISOString();
  saveState(); render(); showToast('已标记为掌握');
}
function checkForUpdate() {
  const done=()=>{showToast('已清理旧缓存，正在刷新');setTimeout(()=>location.reload(),500);};
  try{
    const tasks=[];
    if(navigator.serviceWorker){tasks.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update()))));}
    if(window.caches){tasks.push(caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))));}
    Promise.all(tasks).then(done).catch(done);
  }catch(e){done();}
}

  const body = `<div class="grid cols-2">
    <div class="field"><label>每日目标题量</label><input id="goalInput" type="number" min="5" max="200" value="${state.goals.daily}"></div>

  const safeState=JSON.parse(JSON.stringify(state)); if(safeState.ai) safeState.ai.apiKey=''; safeState.aiHistory=[];
  const payload = {app:'PyPass', version:1, exportedAt:new Date().toISOString(), state:safeState};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `PyPass备份_${todayKey()}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); showToast('备份已导出');
}
function saveGoal() {

</script><script>
function queryTerms(text) {
  const q=String(text||'').toLowerCase();
  const terms=new Set(q.match(/[a-z_][a-z0-9_.]{1,}|[0-9]+|[\u4e00-\u9fa5]{2,}/g)||[]);
  const cn=(q.match(/[\u4e00-\u9fa5]+/g)||[]).join('');
  for(let i=0;i<cn.length-1;i++) terms.add(cn.slice(i,i+2));
  return [...terms].filter(x=>x.length>=2);
}
function relevantUnits(question, context=null, limit=6) {
  const terms=queryTerms(question);
  const ranked=allUnits.map(unit=>{
    const text=[unit.title,unit.chapterName,...(unit.points||[]),...(unit.keywords||[]),unit.trap].join(' ').toLowerCase();
    let score=0;
    terms.forEach(term=>{if(text.includes(term))score+=Math.min(5,term.length);});
    if(context?.type==='unit'&&context.id===unit.id)score+=100;
    if(context?.type==='question'){
      const q=questionMap[context.id];
      if(q&&q.chapter===unit.chapter)score+=4;
      if(q&&q.topic&&text.includes(q.topic.toLowerCase()))score+=8;
    }
    return {unit,score};
  }).sort((a,b)=>b.score-a.score);
  return ranked.filter(x=>x.score>0).slice(0,limit).map(x=>x.unit);
}
function unitContextText(unit) {
  return `【${unit.title}｜大纲要求：${unit.requirement}】\n${(unit.points||[]).join('\n')}${unit.example?`\n示例：\n${unit.example}`:''}${unit.trap?`\n易错：${unit.trap}`:''}`;
}
function buildContextText(question) {
  const top=relevantUnits(question,ui.aiContext,7);
  let text=top.map(unitContextText).join('\n\n');
  if(ui.aiContext?.type==='question'){

const PLAIN_ANSWERS = [
  {keys:['列表','元组'],answer:`一句话：列表像可以涂改的购物清单，元组像已经打印出来的地址条。\n\n列表用 []，可以增加、删除、修改元素；元组用 ()，创建后不能换元素。两者都有顺序，都能用索引和切片。\n\n考试常考：元组不能写 t[0] = 9；元组里每个元素都可哈希时，可以作为字典的键；列表不能作为字典的键。`},
  {keys:['切片'],answer:`一句话：切片就是“从第几个取到第几个，但右边那一个不算”。\n\ns[start:stop:step]：start 是开始位置，stop 是停止位置，step 是每次跨几步。例如 s[1:4] 取索引 1、2、3，不取 4。\n\n考试常考：s[::-1] 是倒序；切片通常越界不报错，但单个索引越界会报 IndexError。`},
  {keys:['递归'],answer:`一句话：递归就是函数自己叫自己，但必须有一个“停下来的条件”。\n\n就像爬楼梯：每上一层就少一层，到了底就停。阶乘可以写成 fact(n) = n * fact(n-1)，当 n <= 1 时直接返回 1。\n\n考试常考：递归必须先写基线条件；递归层数太深会 RecursionError；递归调用后面的代码会在“回来”时执行。`},
  {keys:['append','extend'],answer:`一句话：append 是“整包塞进去”，extend 是“拆开一个个加进去”。\n\nnums.append([3,4]) 后得到 [1,2,[3,4]]；nums.extend([3,4]) 后得到 [1,2,3,4]。\n\n考试常考：append 加一个元素，extend 加多个元素，两者都直接修改原列表。`},
  {keys:['range'],answer:`一句话：range 负责生成一串整数，但右边终点永远拿不到。\n\nrange(1,5) 得到 1、2、3、4；range(5,0,-1) 得到 5、4、3、2、1。\n\n考试常考：range 不是列表，是范围对象；需要列表时要写 list(range(...))。`},
  {keys:['字典'],answer:`一句话：字典就是“查表”：一个键对应一个值。\n\n例如 scores = {"小明": 90}，用 scores["小明"] 查成绩。查不存在的键会报 KeyError，用 scores.get("小红", 0) 更安全。\n\n考试常考：for k in d 遍历键；d.items() 遍历键和值；统计词频常用 counts[word] = counts.get(word, 0) + 1。`},
  {keys:['集合'],answer:`一句话：集合就是“去重袋”，同一个东西只留一份。\n\nset([1,2,2,3]) 得到 {1,2,3}。集合支持交集 &、并集 |、差集 -。\n\n考试常考：空集合必须写 set()，{} 是空字典；集合无序，不能靠位置取值。`},
  {keys:['函数','return'],answer:`一句话：函数就是打包好的一段小工具，给它参数，它帮你算完并返回结果。\n\n没有写 return 时，函数默认返回 None。print 只是把结果显示出来，不等于把结果还给调用者。\n\n考试常考：默认参数、关键字参数、*args、**kwargs、global 和 nonlocal。`},
  {keys:['文件','open'],answer:`一句话：打开文件就像借书，借完要还；最稳的写法是用 with。\n\nwith open("data.txt", encoding="utf-8") as f: 会自动关闭文件。r 是只读，w 是清空重写，a 是追加。\n\n考试常考：read 读全部，readline 读一行，readlines 读全部行；每行通常带 \\n，要先用 strip() 去掉。`},
  {keys:['正则','re.'],answer:`一句话：正则就是按“规律”找文字，不是按固定那一段找。\n\n\\d+ 表示一串数字；^ 表示开头，$ 表示结尾；() 用来把想单独拿出来的部分圈住。\n\n考试常考：search 全串找，match 从开头找，findall 找全部，sub 做替换；写正则一般加前缀 r，例如 r"\\d+"。`},
  {keys:['sqlite','数据库'],answer:`一句话：SQLite 就是用 Python 操作一个小型数据库文件。\n\n步骤：connect 连接 -> cursor 拿游标 -> execute 执行 SQL -> fetchall/fetchone 取结果 -> close 关闭。修改数据后要 commit。\n\n考试常考：不要拼接用户输入，用 ? 占位，例如 execute("SELECT * FROM student WHERE age > ?", (18,))。`},
  {keys:['tkinter','按钮'],answer:`一句话：tkinter 就是搭窗口，把标签、按钮、输入框摆上去，再给按钮绑定一个函数。\n\n按钮绑定写 command=hello，不要写 command=hello()。后者会在程序启动时马上执行。\n\n考试常考：Tk() 创建窗口，pack/grid 布局，mainloop() 进入事件循环，Label.config() 可以改文字。`},
  {keys:['异常','try'],answer:`一句话：异常处理就是“先试一下，出这种错就换一条路”。\n\ntry 放可能出错的代码，except ValueError 专门接住类型转换错误。\n\n考试常考：不要用一个过宽的 except 把真正的问题全吃掉；能明确异常类型就明确写。`},
  {keys:['类','对象'],answer:`一句话：类像模板，对象像按模板做出来的具体东西。\n\nclass Student 是模板，Student("小明") 是对象；__init__ 负责给对象装初始属性，self 表示“当前这个对象”。\n\n考试常考：继承是子类复用父类；封装是管好访问；多态是不同对象对同一个方法给出不同表现。`}
];
function plainLocalAnswer(question) {
  const q=String(question||'').toLowerCase();
  let best=null,bestScore=0;
  for(const item of PLAIN_ANSWERS){
    const score=item.keys.reduce((n,k)=>n+(q.includes(k.toLowerCase())?1:0),0);
    if(score>bestScore){best=item;bestScore=score;}
  }
  return bestScore?best.answer:'';
}
function localAIAnswer(question) {
  if(ui.aiContext?.type==='question'){const q=questionMap[ui.aiContext.id];if(q){const ans=q.type==='self'?'这道题是编程题，请对照参考实现检查。':`正确答案是 ${Array.isArray(q.answer)?q.answer.join(' / '):q.answer}。`;return `这道题先看结论：${ans}\n\n为什么：${q.explanation}\n\n复习时再做一遍，重点检查条件、循环边界和变量变化过程。`;}}
  const plain=plainLocalAnswer(question); if(plain) return plain;
  const top=relevantUnits(question,ui.aiContext,4);
  if(!top.length) return `我在大纲知识库中没有找到足够直接的内容。请换一个更具体的关键词，例如“字符串切片”“for range”“字典 get”“sqlite3 fetchall”。\n\n如果配置外部 AI 服务，也可以在自由问答模式下获得更宽范围的解释。`;

async function callAIProvider(question) {

  const history=(state.aiHistory||[]).slice(-8).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.content}));
  const messages=[{role:'system',content:system},{role:'system',content:`本次检索到的大纲上下文：\n${context}`},...history];
  const headers={'Content-Type':'application/json'};
  if(c.apiKey) headers.Authorization=`Bearer ${c.apiKey}`;
  const response=await fetch(c.baseUrl,{method:'POST',headers,body:JSON.stringify({model:c.model,messages,temperature:Number(c.temperature)||0.3,stream:false})});
  const raw=await response.text();
  let data=null; try{data=JSON.parse(raw);}catch(_){}
  if(!response.ok) throw new Error(`${response.status} ${data?.error?.message||raw.slice(0,180)||response.statusText}`);

  if(!answer) throw new Error('接口返回成功，但没有找到可显示的文本内容');
  return String(answer).trim();
}
